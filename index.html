<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draw a Digit</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8fa; }
    canvas { display: block; }
    #draw { position: fixed; inset: 0; touch-action: none; cursor: crosshair; }
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 8px 20px; border-radius: 999px; background: rgba(11, 15, 26, 0.7);
      color: #fff; font: 600 22px system-ui, sans-serif; user-select: none; pointer-events: none;
      text-align: center; white-space: nowrap;
    }
    #picker {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 2;
    }
    #picker button, #mute {
      width: 48px; height: 48px; border-radius: 50%; border: 2px solid #4fd1ff; cursor: pointer;
      background: #141b2e; color: #fff; font: 700 22px system-ui, sans-serif;
    }
    #picker button:hover, #mute:hover { background: #1e2a48; }
    #picker button.active { background: #ffd23f; border-color: #ffd23f; color: #0b0f1a; }
    #picker button.hint { background: #35c46a; border-color: #35c46a; animation: hint 0.7s ease-in-out infinite alternate; }
    @keyframes hint { to { transform: scale(1.3); } }
    #status.mic::after { content: ' 🎤'; }
    #mute { position: fixed; top: 16px; right: 16px; z-index: 2; font-size: 20px; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.6s ease-out; z-index: 3; }
    #flash.on { opacity: 0.9; transition: none; }
    #photo {
      position: fixed; top: 76px; right: 20px; z-index: 2; width: min(38vw, 260px);
      padding: 10px 10px 0; background: #fff; border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transform: translateX(130%) rotate(12deg); transition: transform 0.7s cubic-bezier(0.2, 1.3, 0.4, 1); pointer-events: none;
    }
    #photo.show { transform: translateX(0) rotate(4deg); }
    #photo canvas { display: block; width: 100%; aspect-ratio: 1; background: #ccd; }
    #photo div { font: 600 16px system-ui, sans-serif; color: #333; text-align: center; padding: 8px 0 10px; }
  </style>
</head>
<body>
  <canvas id="draw"></canvas>
  <div id="status">Pick a number below 👇</div>
  <button id="mute" title="Sound on/off">🔊</button>
  <div id="flash"></div>
  <div id="photo"><canvas width="360" height="360"></canvas><div>Santa &amp; Snowman ❤️</div></div>
  <div id="picker">
    <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button>
    <button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const COUNT = 12000;      // particles used for the digit -> object morph
    const GROUND_Y = -1.95;
    const C = (hex) => new THREE.Color(hex);
    const rand = Math.random;
    const { clamp, lerp } = THREE.MathUtils;

    // ---------- renderer + outdoor scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // image-based lighting so metal and glossy plastic have something to reflect
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    const CAM_R = Math.hypot(0.5, 8), CAM_A = Math.atan2(0.5, 8), CAM_Y = 1.2;
    let camLookY = 0;
    function homeCamera() {
      camLookY = 0;
      camera.position.set(Math.sin(CAM_A) * CAM_R, CAM_Y, Math.cos(CAM_A) * CAM_R);
      camera.lookAt(0, 0, 0);
      camera.updateMatrixWorld();
    }
    homeCamera();

    // sky + ground colours blend between a sunny day and a snowy one
    const ENV = {
      day: { top: C(0x2f7fd8), bottom: C(0xcfe8fa), ground: C(0x6fb354) },
      snow: { top: C(0x7f93aa), bottom: C(0xdfe7ef), ground: C(0xf2f6fb) },
    };
    let envTarget = ENV.day;

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
      uniforms: { uTop: { value: ENV.day.top.clone() }, uBottom: { value: ENV.day.bottom.clone() } },
      vertexShader: /* glsl */ `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3 uTop;
        uniform vec3 uBottom;
        varying vec3 vDir;
        void main() {
          float h = clamp(vDir.y * 1.6, 0.0, 1.0);
          gl_FragColor = vec4(mix(uBottom, uTop, pow(h, 0.55)), 1.0);
          #include <colorspace_fragment>
        }
      `,
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), skyMat));
    scene.fog = new THREE.Fog(ENV.day.bottom.clone(), 30, 110);

    // small canvas textures
    function canvasTexture(size, draw) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      draw(c.getContext('2d'), size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const grainTex = canvasTexture(256, (g, s) => {
      g.fillStyle = '#e4e4e4';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 9000; i++) {
        const v = 150 + Math.floor(rand() * 105);
        g.fillStyle = `rgba(${v},${v},${v},0.55)`;
        g.fillRect(rand() * s, rand() * s, 1 + rand() * 1.5, 2 + rand() * 4);
      }
    });
    grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
    grainTex.repeat.set(70, 70);
    const dotTex = canvasTexture(64, (g, s) => {
      const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.6, 'rgba(255,255,255,0.9)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
    });

    const groundMat = new THREE.MeshStandardMaterial({ color: ENV.day.ground.clone(), map: grainTex, roughness: 1 });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(150, 64), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = GROUND_Y;
    ground.receiveShadow = true;
    scene.add(ground);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8fae7a, 0.75));
    const sun = new THREE.DirectionalLight(0xfff3dd, 2.6);
    sun.position.set(5, 9, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 0.5, far: 40 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    // drifting clouds
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, fog: false });
    const clouds = Array.from({ length: 7 }, (_, i) => {
      const cloud = new THREE.Group();
      for (let j = 0; j < 5; j++) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(1.6 + rand() * 1.2, 16, 12), cloudMat);
        puff.position.set(j * 1.9 - 3.8 + rand(), rand() * 0.7, rand() * 1.5);
        puff.scale.y = 0.6;
        cloud.add(puff);
      }
      cloud.position.set(-42 + i * 14 + rand() * 5, 7 + rand() * 6, -42 - rand() * 14);
      scene.add(cloud);
      return cloud;
    });

    // ---------- sound (all synthesised with Web Audio, no files) ----------
    const audio = { ctx: null, master: null, noiseBuf: null, muted: false, loops: [] };
    function actx() {
      if (!audio.ctx) {
        const ctx = (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
        audio.master = ctx.createGain();
        audio.master.gain.value = audio.muted ? 0 : 0.9;
        audio.master.connect(ctx.createDynamicsCompressor()).connect(ctx.destination);
        audio.noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const data = audio.noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = rand() * 2 - 1;
      }
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
      return audio.ctx;
    }

    function tone({ type = 'sine', f = 440, f2 = f, dur = 0.2, gain = 0.1, at = 0, attack = 0.008 }) {
      const ctx = actx(), t0 = ctx.currentTime + at;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audio.master);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    }

    function noiseSource(ctx, when = 0) {
      const src = ctx.createBufferSource();
      src.buffer = audio.noiseBuf;
      src.loop = true;
      src.start(when, rand() * 1.5);
      return src;
    }

    function noise({ filter = 'lowpass', f = 1000, f2 = f, q = 1, dur = 0.2, gain = 0.1, at = 0, attack = 0.005 }) {
      const ctx = actx(), t0 = ctx.currentTime + at;
      const src = noiseSource(ctx, t0), bq = ctx.createBiquadFilter(), g = ctx.createGain();
      bq.type = filter;
      bq.Q.value = q;
      bq.frequency.setValueAtTime(f, t0);
      if (f2 !== f) bq.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(bq).connect(g).connect(audio.master);
      src.stop(t0 + dur + 0.05);
    }

    // continuous sounds (rumble, wind, motor): returns a handle with set(volume) / stop()
    function startLoop(build) {
      const ctx = actx();
      const out = ctx.createGain();
      out.gain.value = 0;
      out.connect(audio.master);
      const handle = {
        ...build(ctx, out),
        set(v, seconds = 0.3) { out.gain.setTargetAtTime(v, ctx.currentTime, seconds / 3); },
        stop(fade = 0.3) {
          this.set(0, fade);
          audio.loops = audio.loops.filter((h) => h !== this);
          setTimeout(() => {
            this.sources.forEach((s) => { try { s.stop(); } catch { /* already stopped */ } });
            out.disconnect();
          }, fade * 1000 + 300);
        },
      };
      audio.loops.push(handle);
      return handle;
    }
    function lfo(ctx, hz, depth, param) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = hz;
      g.gain.value = depth;
      o.connect(g).connect(param);
      o.start();
      return o;
    }
    function filtered(ctx, src, type, f, q = 1) {
      const bq = ctx.createBiquadFilter();
      bq.type = type;
      bq.frequency.value = f;
      bq.Q.value = q;
      src.connect(bq);
      return bq;
    }

    const rawSfx = {
      click: () => tone({ f: 660, dur: 0.07, gain: 0.08 }),
      pop: (n) => tone({ type: 'triangle', f: 420 + n * 38, f2: (420 + n * 38) * 1.5, dur: 0.11, gain: 0.13 }),
      chime: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.6, gain: 0.12, at: i * 0.09 })),
      whoosh() {
        noise({ filter: 'bandpass', f: 300, f2: 2600, q: 1.2, dur: 2.8, gain: 0.1, attack: 0.9 });
        for (let i = 0; i < 10; i++) tone({ f: 1500 + rand() * 2500, dur: 0.14, gain: 0.03, at: 0.3 + i * 0.25 });
      },
      thud() {
        tone({ f: 120, f2: 42, dur: 0.28, gain: 0.5 });
        noise({ f: 350, dur: 0.12, gain: 0.22 });
      },
      beep: () => tone({ type: 'square', f: 880, dur: 0.18, gain: 0.05 }),
      oops: () => tone({ type: 'triangle', f: 330, f2: 210, dur: 0.32, gain: 0.14 }),
      shutter() { // phone camera "click-clack"
        noise({ filter: 'highpass', f: 2500, dur: 0.04, gain: 0.35 });
        noise({ filter: 'bandpass', f: 1800, q: 2, dur: 0.06, gain: 0.3, at: 0.09 });
      },
      ignite: () => noise({ f: 2400, f2: 200, dur: 1.2, gain: 0.4, attack: 0.05 }),
      whee() {
        // slide-whistle swoop for a kid going down the slide
        const ctx = actx(), t0 = ctx.currentTime, dur = 1.7;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.setValueAtTime(700, t0);
        o.frequency.exponentialRampToValueAtTime(1500, t0 + 0.3);
        o.frequency.exponentialRampToValueAtTime(480, t0 + dur);
        const vib = lfo(ctx, 9, 25, o.frequency);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.045, t0 + 0.05);
        g.gain.setValueAtTime(0.045, t0 + dur - 0.4);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(audio.master);
        o.start(t0);
        o.stop(t0 + dur + 0.05);
        vib.stop(t0 + dur + 0.05);
      },
      flap: () => noise({ f: 420 + rand() * 250, dur: 0.1, gain: 0.16 }),
      swish: () => noise({ filter: 'bandpass', f: 500, f2: 3200, q: 1.4, dur: 0.28, gain: 0.22, attack: 0.18 }),
      tock() { // club face meets the ball
        tone({ type: 'triangle', f: 2300, f2: 1300, dur: 0.07, gain: 0.32 });
        noise({ filter: 'highpass', f: 2500, dur: 0.03, gain: 0.25 });
      },
      cup() { // ball rattles round the cup and drops in
        [0, 0.07, 0.13].forEach((at) => tone({ type: 'triangle', f: 1500, f2: 950, dur: 0.08, gain: 0.12, at }));
        tone({ f: 520, f2: 300, dur: 0.16, gain: 0.2, at: 0.2 });
      },
      clap() { // a small crowd applauding
        for (let i = 0; i < 34; i++) noise({ filter: 'bandpass', f: 1200 + rand() * 1800, q: 1.5, dur: 0.05, gain: 0.05 + rand() * 0.1, at: 0.25 + rand() * 1.8 });
      },
      clank() {
        [523, 811, 1293, 1740].forEach((f) => tone({ type: 'triangle', f, dur: 0.5, gain: 0.06 }));
        noise({ filter: 'highpass', f: 3000, dur: 0.06, gain: 0.15 });
      },
      whistle(dur) {
        // high tone warbled by the "pea" inside, plus breath noise
        const ctx = actx(), t0 = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 2600;
        const warble = lfo(ctx, 28, 180, o.frequency);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.12, t0 + 0.05);
        g.gain.setValueAtTime(0.12, t0 + dur - 0.08);
        g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(audio.master);
        o.start(t0);
        o.stop(t0 + dur + 0.05);
        warble.stop(t0 + dur + 0.05);
        noise({ filter: 'bandpass', f: 3200, q: 2, dur, gain: 0.03, attack: 0.05 });
      },
      step(pitch = 1) {
        tone({ f: 95 * pitch, f2: 50 * pitch, dur: 0.1, gain: 0.28 });
        noise({ f: 600, dur: 0.05, gain: 0.07 });
      },
      tap: () => tone({ type: 'triangle', f: 1200, f2: 900, dur: 0.05, gain: 0.2 }),
      pick: () => tone({ f: 500, f2: 900, dur: 0.14, gain: 0.12 }),
      yum: () => [784, 988, 1175, 1568].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.25, gain: 0.1, at: i * 0.1 })),
      hoho(at = 0) {
        // three deep "ho"s: low sawtooth through vowel formants, pitch stepping down
        const ctx = actx();
        [150, 135, 118].forEach((f, i) => {
          const t0 = ctx.currentTime + at + i * 0.32, dur = 0.24;
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(f * 1.15, t0);
          o.frequency.exponentialRampToValueAtTime(f, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(0.5, t0 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          filtered(ctx, o, 'bandpass', 480, 4).connect(g);
          filtered(ctx, o, 'bandpass', 850, 5).connect(g);
          g.connect(audio.master);
          o.start(t0);
          o.stop(t0 + dur + 0.05);
        });
      },
      jingle() {
        for (let i = 0; i < 8; i++) {
          noise({ filter: 'bandpass', f: 6500, q: 8, dur: 0.09, gain: 0.12, at: i * 0.14 });
          tone({ f: i % 2 ? 3136 : 2637, dur: 0.12, gain: 0.03, at: i * 0.14 });
        }
      },
    };
    const rawLoops = {
      rumble: () => startLoop((ctx, out) => {
        const low = noiseSource(ctx), lp = filtered(ctx, low, 'lowpass', 240);
        lp.connect(out);
        const crackle = noiseSource(ctx), cg = ctx.createGain();
        cg.gain.value = 0.2;
        filtered(ctx, crackle, 'bandpass', 1000, 0.7).connect(cg).connect(out);
        return { sources: [low, crackle, lfo(ctx, 13, 90, lp.frequency)] };
      }),
      wind: () => startLoop((ctx, out) => {
        const n = noiseSource(ctx), bp = filtered(ctx, n, 'bandpass', 420, 0.5);
        bp.connect(out);
        return { sources: [n, lfo(ctx, 0.31, 260, bp.frequency)] };
      }),
      motor: () => startLoop((ctx, out) => {
        const osc = ctx.createOscillator(), buzz = ctx.createOscillator(), bg = ctx.createGain();
        osc.type = 'sawtooth';
        buzz.type = 'square';
        osc.frequency.value = 58;
        buzz.frequency.value = 116;
        bg.gain.value = 0.3;
        const lp = filtered(ctx, osc, 'lowpass', 500);
        buzz.connect(bg).connect(lp);
        lp.connect(out);
        osc.start();
        buzz.start();
        return { sources: [osc, buzz], setPitch(hz) { osc.frequency.value = hz; buzz.frequency.value = hz * 2; } };
      }),
    };
    // audio must never break the visuals: every call is guarded
    const guard = (table, fallback) => Object.fromEntries(Object.entries(table).map(([k, fn]) => [k, (...a) => {
      try { return fn(...a); } catch (e) { console.warn('[audio]', k, e); return fallback; }
    }]));
    const sfx = guard(rawSfx);
    const loops = guard(rawLoops, { set() {}, stop() {}, setPitch() {} });
    function stopLoops() { [...audio.loops].forEach((h) => h.stop()); }

    const muteBtn = document.getElementById('mute');
    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      if (audio.muted) window.speechSynthesis?.cancel();
      muteBtn.textContent = audio.muted ? '🔇' : '🔊';
      if (audio.master) audio.master.gain.value = audio.muted ? 0 : 0.9;
    });

    // ---------- geometry helpers ----------
    function samplePoints(geometry, count) {
      const sampler = new MeshSurfaceSampler(new THREE.Mesh(geometry)).build();
      const p = new THREE.Vector3();
      const out = [];
      for (let i = 0; i < count; i++) {
        sampler.sample(p);
        out.push(p.clone());
      }
      return out;
    }

    function transformed(geometry, { pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1] }) {
      const m = new THREE.Matrix4().compose(
        new THREE.Vector3(...pos),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)),
        new THREE.Vector3(...scale)
      );
      return geometry.applyMatrix4(m);
    }

    // cylinder between two points
    function rod(a, b, radius = 0.05) {
      const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
      const dir = B.clone().sub(A);
      const geo = new THREE.CylinderGeometry(radius, radius, dir.length(), 12);
      geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()));
      return geo.translate(...A.clone().add(B).multiplyScalar(0.5).toArray());
    }

    // surface presets
    const STEEL = { metalness: 0.9, roughness: 0.28 };
    const CHROME = { metalness: 0.6, roughness: 0.25 }; // not a full mirror: there is only sky and grass to reflect
    const BRASS = { metalness: 1, roughness: 0.3 };
    const PAINTED = { metalness: 0.3, roughness: 0.45 };
    const WOOD = { roughness: 0.5, clearcoat: 0.5, clearcoatRoughness: 0.3 };
    const MATTE = { roughness: 0.95 };

    function makeMat(color, m = {}) {
      const params = { color: color.clone(), roughness: 0.6, metalness: 0, ...m };
      return 'clearcoat' in m ? new THREE.MeshPhysicalMaterial(params) : new THREE.MeshStandardMaterial(params);
    }

    // Build one object two ways from the same part list:
    //  - points: surface samples the particle morph flies to
    //  - group:  the solid, lit model that replaces the particles once they arrive
    // parts = [{ share, color, geo | geos, m, material, name }]; share 0/undefined = solid-only detail,
    // name = put the meshes in a sub-group (named[name]) so it can be animated.
    function buildModel(parts, yOffset = 0, count = COUNT) {
      const group = new THREE.Group();
      group.position.y = yOffset;
      group.visible = false;
      const named = {};
      const points = [];
      const sampled = parts.filter((p) => p.share);
      let remaining = count;
      for (const part of parts) {
        const geos = part.geos ?? [part.geo];
        const material = part.material ?? makeMat(part.color, part.m);
        let holder = group;
        if (part.name) {
          if (!named[part.name]) group.add((named[part.name] = new THREE.Group()));
          holder = named[part.name];
        }
        for (const g of geos) {
          const mesh = new THREE.Mesh(g, material);
          mesh.castShadow = mesh.receiveShadow = true;
          holder.add(mesh);
        }
        if (part.share) {
          const n = part === sampled[sampled.length - 1] ? remaining : Math.round(count * part.share);
          remaining -= n;
          const per = Math.ceil(n / geos.length);
          for (const p of geos.flatMap((g) => samplePoints(g, per)).slice(0, n)) {
            p.y += yOffset;
            points.push({ p, c: part.color });
          }
        }
      }
      return { points, group, named };
    }

    // make a named sub-group rotate/scale about a point instead of the origin
    function setPivot(holder, x, y, z) {
      holder.position.set(x, y, z);
      holder.children.forEach((c) => c.position.set(-x, -y, -z));
    }

    // ---------- digits: glossy solid numbers with a vertical colour gradient ----------
    const DIGIT_R = 0.28;
    const cTop = C(0x35b8ff);
    const cBottom = C(0xa63dff);
    const gradientAt = (y) => cBottom.clone().lerp(cTop, clamp((y + 1.6) / 3.3, 0, 1));
    const digitMaterial = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.15 });

    function paintGradient(geo) {
      const pos = geo.attributes.position;
      const col = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const c = gradientAt(pos.getY(i));
        col.set([c.r, c.g, c.b], i * 3);
      }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      return geo;
    }

    // paths = the strokes of the digit (one, or two for the 4)
    function buildDigit(paths) {
      const group = new THREE.Group();
      group.visible = false;
      const total = paths.reduce((s, p) => s + p.getLength(), 0);
      const points = [];
      let remaining = COUNT;
      paths.forEach((path, i) => {
        // spheres round off the ends and any sharp corners between segments
        const joints = path.curves
          ? [path.curves[0].getPoint(0), ...path.curves.map((c) => c.getPoint(1))]
          : [path.getPoint(0), path.getPoint(1)];
        const geos = [
          new THREE.TubeGeometry(path, 300, DIGIT_R, 24, false),
          ...joints.map((j) => new THREE.SphereGeometry(DIGIT_R, 24, 16).translate(j.x, j.y, j.z)),
        ];
        for (const g of geos) {
          const mesh = new THREE.Mesh(paintGradient(g), digitMaterial);
          mesh.castShadow = true;
          group.add(mesh);
        }
        const n = i === paths.length - 1 ? remaining : Math.round((COUNT * path.getLength()) / total);
        remaining -= n;
        const capN = Math.round(n * 0.025);
        const pts = [
          ...samplePoints(geos[0], n - capN * 2),
          ...samplePoints(geos[1], capN),
          ...samplePoints(geos[geos.length - 1], capN),
        ];
        for (const p of pts) points.push({ p, c: gradientAt(p.y) });
      });
      return { points, group };
    }

    // ---------- digit paths ----------
    // "1": small flag, then straight down
    const onePath = new THREE.CurvePath();
    onePath.add(new THREE.LineCurve3(new THREE.Vector3(-0.5, 0.85, 0), new THREE.Vector3(0, 1.4, 0)));
    onePath.add(new THREE.LineCurve3(new THREE.Vector3(0, 1.4, 0), new THREE.Vector3(0, -1.4, 0)));

    // "2": arc, diagonal, base
    const arcPts = [];
    for (let a = THREE.MathUtils.degToRad(160); a >= THREE.MathUtils.degToRad(-35); a -= 0.05) {
      arcPts.push(new THREE.Vector3(Math.cos(a) * 0.85, 0.75 + Math.sin(a) * 0.85, 0));
    }
    const twoBL = new THREE.Vector3(-0.95, -1.35, 0);
    const twoBR = new THREE.Vector3(1.05, -1.35, 0);
    const twoPath = new THREE.CurvePath();
    twoPath.add(new THREE.CatmullRomCurve3(arcPts));
    twoPath.add(new THREE.LineCurve3(arcPts[arcPts.length - 1].clone(), twoBL));
    twoPath.add(new THREE.LineCurve3(twoBL, twoBR));

    // "3": two stacked arcs
    const threePts = [];
    for (let a = 150; a >= -90; a -= 4) {
      const r = THREE.MathUtils.degToRad(a);
      threePts.push(new THREE.Vector3(Math.cos(r) * 0.7, 0.7 + Math.sin(r) * 0.7, 0));
    }
    for (let a = 86; a >= -150; a -= 4) {
      const r = THREE.MathUtils.degToRad(a);
      threePts.push(new THREE.Vector3(Math.cos(r) * 0.75, -0.75 + Math.sin(r) * 0.75, 0));
    }
    const threePath = new THREE.CatmullRomCurve3(threePts);

    // "4": diagonal + crossbar, then a separate stem
    const fourA = new THREE.Vector3(0.35, 1.4, 0);
    const fourB = new THREE.Vector3(-0.95, -0.35, 0);
    const fourC = new THREE.Vector3(1.0, -0.35, 0);
    const fourPath = new THREE.CurvePath();
    fourPath.add(new THREE.LineCurve3(fourA, fourB));
    fourPath.add(new THREE.LineCurve3(fourB, fourC));
    const stemPath = new THREE.LineCurve3(new THREE.Vector3(0.35, 1.05, 0), new THREE.Vector3(0.35, -1.4, 0));

    // "5": top bar, stem, belly
    const fiveBarRight = new THREE.Vector3(0.85, 1.4, 0);
    const fiveTopLeft = new THREE.Vector3(-0.6, 1.4, 0);
    const fiveStemBottom = new THREE.Vector3(-0.68, 0.25, 0);
    const bellyPts = [fiveStemBottom.clone()];
    for (let a = 125; a >= -150; a -= 5) {
      const r = THREE.MathUtils.degToRad(a);
      bellyPts.push(new THREE.Vector3(Math.cos(r) * 0.85, -0.45 + Math.sin(r) * 0.85, 0));
    }
    const bellyCurve = new THREE.CatmullRomCurve3(bellyPts);
    const fivePath = new THREE.CurvePath();
    fivePath.add(new THREE.LineCurve3(fiveBarRight, fiveTopLeft));
    fivePath.add(new THREE.LineCurve3(fiveTopLeft, fiveStemBottom));
    fivePath.add(bellyCurve);

    // "6": sweep down from the top-right into a loop
    const sixPts = [new THREE.Vector3(0.7, 1.45, 0), new THREE.Vector3(0.1, 1.3, 0), new THREE.Vector3(-0.5, 0.75, 0)];
    for (let a = 180; a <= 525; a += 6) {
      const r = THREE.MathUtils.degToRad(a);
      sixPts.push(new THREE.Vector3(Math.cos(r) * 0.8, -0.6 + Math.sin(r) * 0.8, 0));
    }
    const sixPath = new THREE.CatmullRomCurve3(sixPts);

    // "7": top bar, then the long diagonal
    const sevenR = new THREE.Vector3(0.55, 1.4, 0);
    const sevenPath = new THREE.CurvePath();
    sevenPath.add(new THREE.LineCurve3(new THREE.Vector3(-0.75, 1.4, 0), sevenR));
    sevenPath.add(new THREE.LineCurve3(sevenR, new THREE.Vector3(-0.25, -1.4, 0)));

    // "8": figure-eight, starting at the top heading left
    const eightPts = [];
    for (let t = Math.PI / 2; t <= Math.PI / 2 + Math.PI * 2 + 0.001; t += 0.06) {
      eightPts.push(new THREE.Vector3(1.5 * Math.sin(t) * Math.cos(t), 1.45 * Math.sin(t), 0));
    }
    const eightPath = new THREE.CatmullRomCurve3(eightPts);

    // "9": loop first (from its right side, going up and around), then the stem
    const ninePts = [];
    for (let a = 10; a <= 370; a += 6) {
      const r = THREE.MathUtils.degToRad(a);
      ninePts.push(new THREE.Vector3(Math.cos(r) * 0.68, 0.72 + Math.sin(r) * 0.68, 0));
    }
    const ninePath = new THREE.CurvePath();
    ninePath.add(new THREE.CatmullRomCurve3(ninePts));
    ninePath.add(new THREE.LineCurve3(ninePts[ninePts.length - 1].clone(), new THREE.Vector3(0.62, -1.45, 0)));

    // ---------- Santa Claus (rides the slide, carries the walking stick and the lollipop) ----------
    // A jointed figure with human proportions (about 6.5 heads tall): hips, knees, shoulders and elbows
    // all bend. Faces +X, feet at the origin, hips at y = 0.85.
    const fabricTex = canvasTexture(128, (g, s) => {
      g.fillStyle = '#808080';
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 6000; i++) {
        const v = 80 + Math.floor(rand() * 100);
        g.fillStyle = `rgb(${v},${v},${v})`;
        g.fillRect(rand() * s, rand() * s, 1 + rand(), 1 + rand());
      }
    });
    fabricTex.wrapS = fabricTex.wrapT = THREE.RepeatWrapping;
    fabricTex.repeat.set(6, 6);
    const SANTA = {
      // velvet: rough, with a soft sheen at grazing angles
      suit: new THREE.MeshPhysicalMaterial({
        color: 0xb3121a, roughness: 0.85, sheen: 1, sheenColor: C(0xff7a7a), sheenRoughness: 0.45,
        bumpMap: fabricTex, bumpScale: 0.4, side: THREE.DoubleSide,
      }),
      fur: new THREE.MeshStandardMaterial({ color: 0xf8f6f1, roughness: 1 }),
      skin: new THREE.MeshPhysicalMaterial({ color: 0xe6b494, roughness: 0.55, sheen: 0.5, sheenColor: C(0xffb9a0), sheenRoughness: 0.6 }),
      rosy: new THREE.MeshStandardMaterial({ color: 0xdf8d7e, roughness: 0.5 }),
      leather: new THREE.MeshPhysicalMaterial({ color: 0x15110e, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.3, side: THREE.DoubleSide }),
      gold: new THREE.MeshStandardMaterial({ color: 0xe0a800, metalness: 1, roughness: 0.25 }),
      eyeWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }),
      iris: new THREE.MeshStandardMaterial({ color: 0x3b6ea8, roughness: 0.2 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x120c0a, roughness: 0.3 }),
      mouth: new THREE.MeshStandardMaterial({ color: 0x7a2a2a, roughness: 0.6 }),
    };

    function limb(a, b, radius, material) {
      const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
      const dir = B.clone().sub(A);
      const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(radius, dir.length(), 6, 14), material);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      mesh.position.copy(A.add(B).multiplyScalar(0.5));
      return mesh;
    }
    function ball(radius, material, pos, scale = [1, 1, 1]) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 14), material);
      mesh.position.set(...pos);
      mesh.scale.set(...scale);
      return mesh;
    }
    // fluffy fur: lots of small overlapping tufts merged into one mesh. points = [x, y, z, radius?]
    function fluff(points, radius, jitter = 0.4) {
      const j = (r) => (rand() - 0.5) * r * jitter;
      return new THREE.Mesh(mergeGeometries(points.map(([x, y, z, r = radius]) =>
        new THREE.SphereGeometry(r * (0.8 + rand() * 0.45), 7, 5).translate(x + j(r), y + j(r), z + j(r)))), SANTA.fur);
    }
    const ringPts = (n, fn) => Array.from({ length: n }, (_, i) => fn((i / n) * Math.PI * 2));

    // the coat is a lathe profile [radius, height above the hips], squashed front-to-back
    // and pushed out at the front into a proper belly
    const COAT = [[0.3, -0.24], [0.295, -0.1], [0.31, 0.05], [0.325, 0.16], [0.31, 0.3], [0.275, 0.42], [0.225, 0.51], [0.13, 0.575], [0.085, 0.6]];
    function coatR(y) {
      for (let i = 1; i < COAT.length; i++) {
        if (y <= COAT[i][1]) return lerp(COAT[i - 1][0], COAT[i][0], clamp((y - COAT[i - 1][1]) / (COAT[i][1] - COAT[i - 1][1]), 0, 1));
      }
      return COAT[COAT.length - 1][0];
    }
    const COAT_FLAT = 0.9;
    const bellyBulge = (y) => 1 + 0.2 * Math.exp(-(((y - 0.12) / 0.2) ** 2));
    function shapeTorso(geo) {
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        pos.setXYZ(i, x > 0 ? x * bellyBulge(pos.getY(i)) : x, pos.getY(i), pos.getZ(i) * COAT_FLAT);
      }
      geo.computeVertexNormals();
      return geo;
    }
    // x of the coat's surface at height y and sideways offset z (front half)
    const coatFront = (y, z = 0) => Math.sqrt(Math.max(0, coatR(y) ** 2 - (z / COAT_FLAT) ** 2)) * bellyBulge(y);

    // floppy hat: a cone whose centre line curls over backwards
    function hatGeometry(R, H, bend) {
      const centre = (t) => { // walk the bent centre line up to t (0 = brim, 1 = tip)
        let x = 0, y = 0;
        const N = 24;
        for (let k = 0; k < N; k++) {
          const a = Math.PI / 2 + bend * (((k + 0.5) / N) * t) ** 2;
          x += (Math.cos(a) * H * t) / N;
          y += (Math.sin(a) * H * t) / N;
        }
        return [x, y];
      };
      const geo = new THREE.ConeGeometry(R, H, 24, 16, true);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const t = (pos.getY(i) + H / 2) / H, a = Math.PI / 2 + bend * t * t;
        const [cx, cy] = centre(t), x = pos.getX(i);
        pos.setXYZ(i, cx + x * Math.sin(a), cy - x * Math.cos(a), pos.getZ(i));
      }
      geo.computeVertexNormals();
      return { geo, tip: centre(1) };
    }

    function makeSanta() {
      const M = SANTA;
      const santa = new THREE.Group();
      const body = new THREE.Group(); // everything; bobs up and down with the stride
      santa.add(body);

      // --- legs: thigh -> knee -> shin tucked into a fur-topped boot ---
      const legs = [];
      for (const side of [1, -1]) {
        const hip = new THREE.Group();
        hip.position.set(0, 0.85, side * 0.115);
        hip.add(limb([0, 0, 0], [0, -0.42, 0], 0.105, M.suit));
        const knee = new THREE.Group();
        knee.position.y = -0.42;
        knee.add(ball(0.098, M.suit, [0, 0, 0]), limb([0, 0, 0], [0, -0.16, 0], 0.09, M.suit));
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.094, 0.084, 0.25, 20), M.leather);
        shaft.position.y = -0.27;
        knee.add(
          shaft,
          fluff(ringPts(10, (a) => [Math.cos(a) * 0.092, -0.15, Math.sin(a) * 0.092]), 0.036),
          ball(0.09, M.leather, [0.065, -0.375, 0], [1.75, 0.62, 1.02]),  // foot
          ball(0.07, M.leather, [-0.01, -0.36, 0], [1, 0.9, 1.1]),        // heel
        );
        hip.add(knee);
        body.add(hip);
        legs.push({ hip, knee });
      }

      // --- torso: velvet coat over a round belly, fur trim, leather belt with a brass buckle ---
      const upper = new THREE.Group();
      upper.position.y = 0.85;
      body.add(upper);
      const profile = new THREE.SplineCurve(COAT.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(36);
      upper.add(new THREE.Mesh(shapeTorso(new THREE.LatheGeometry(profile, 48)), M.suit));
      const BELT_Y = 0.07;
      upper.add(new THREE.Mesh(
        shapeTorso(new THREE.CylinderGeometry(coatR(BELT_Y) + 0.012, coatR(BELT_Y) + 0.012, 0.085, 48, 1, true).translate(0, BELT_Y, 0)), M.leather));
      const buckle = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.013, 8, 4).rotateZ(Math.PI / 4).rotateY(Math.PI / 2), M.gold);
      buckle.position.set(coatFront(BELT_Y) + 0.022, BELT_Y, 0);
      const prong = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.08), M.gold);
      prong.position.copy(buckle.position);
      upper.add(buckle, prong);
      // fur: hem, the strip down the front (skipping the belt), collar
      const strip = [];
      for (let y = -0.2; y <= 0.5; y += 0.045) if (Math.abs(y - BELT_Y) > 0.065) strip.push([coatFront(y) + 0.012, y, 0]);
      upper.add(
        fluff(ringPts(28, (a) => [Math.cos(a) * 0.3 * (Math.cos(a) > 0 ? bellyBulge(-0.24) : 1), -0.24, Math.sin(a) * 0.3 * COAT_FLAT]), 0.052),
        fluff(strip, 0.043),
        fluff(ringPts(14, (a) => [Math.cos(a) * 0.125 + 0.01, 0.565, Math.sin(a) * 0.125]), 0.047),
        limb([0, 0.58, 0], [0.012, 0.67, 0], 0.055, M.skin), // neck
      );

      // --- arms: shoulder -> elbow -> fur cuff -> black leather mitten ---
      const arms = [];
      for (const side of [1, -1]) {
        const shoulder = new THREE.Group();
        shoulder.position.set(0, 0.49, side * 0.25);
        shoulder.add(ball(0.092, M.suit, [0, 0, 0]), limb([0, 0, 0], [0, -0.3, 0], 0.076, M.suit));
        const elbow = new THREE.Group();
        elbow.position.y = -0.3;
        const hand = ball(0.06, M.leather, [0.005, -0.345, 0], [0.9, 1.2, 0.75]);
        elbow.add(
          ball(0.072, M.suit, [0, 0, 0]),
          limb([0, 0, 0], [0, -0.24, 0], 0.066, M.suit),
          fluff(ringPts(9, (a) => [Math.cos(a) * 0.066, -0.265, Math.sin(a) * 0.066]), 0.033),
          hand,
          ball(0.026, M.leather, [0.05, -0.32, 0], [1, 1.5, 1]), // thumb
        );
        shoulder.add(elbow);
        upper.add(shoulder);
        arms.push({ shoulder, elbow, hand });
      }

      // --- head ---
      const head = new THREE.Group();
      head.position.set(0.015, 0.76, 0);
      upper.add(head);
      head.add(
        ball(0.125, M.skin, [0, 0, 0], [0.97, 1.1, 0.92]),
        ball(0.03, M.rosy, [0.124, -0.008, 0], [1, 0.95, 1.05]),                       // nose
        limb([0.112, -0.06, 0.016], [0.112, -0.06, -0.016], 0.008, M.mouth),            // mouth, under the moustache
      );
      for (const side of [1, -1]) {
        head.add(
          ball(0.019, M.eyeWhite, [0.097, 0.028, side * 0.046], [0.7, 1, 1.15]),
          ball(0.0105, M.iris, [0.109, 0.028, side * 0.046]),
          ball(0.006, M.dark, [0.1165, 0.028, side * 0.046]),
          ball(0.034, M.rosy, [0.09, -0.026, side * 0.064], [0.5, 0.8, 1]),              // rosy cheek
          ball(0.032, M.skin, [-0.005, 0, side * 0.115], [0.6, 1, 0.4]),                 // ear
          fluff([[0.113, 0.064, side * 0.03], [0.112, 0.068, side * 0.048], [0.106, 0.064, side * 0.066]], 0.013, 0.2), // bushy brow
          // moustache: thick by the nose, tapering out and down
          fluff([[0.128, -0.036, side * 0.014, 0.024], [0.124, -0.042, side * 0.04, 0.022], [0.114, -0.05, side * 0.066, 0.018], [0.1, -0.058, side * 0.088, 0.013]], 0.02, 0.2),
        );
        // small round gold spectacles
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.029, 0.0035, 6, 24).rotateY(Math.PI / 2), M.gold);
        rim.position.set(0.121, 0.028, side * 0.046);
        head.add(rim, limb([0.118, 0.03, side * 0.075], [0, 0.03, side * 0.118], 0.003, M.gold));
      }
      head.add(limb([0.123, 0.032, 0.017], [0.123, 0.032, -0.017], 0.003, M.gold)); // bridge

      // full beard: from the sideburns round the jaw, hanging down and draped over the chest
      const beard = [];
      for (let i = 0; i < 170; i++) {
        const phi = (rand() * 2 - 1) * 1.85, front = Math.cos(phi) * 0.5 + 0.5, v = rand();
        const y = lerp(0.0, -0.075, front) - v * (0.07 + 0.2 * front ** 1.5); // longest at the chin
        const spread = 1 - v * 0.3;
        const z = Math.sin(phi) * 0.112 * spread * 0.95;
        // never sink into the coat: rest on its surface (head coordinates -> torso coordinates and back)
        const x = Math.max(Math.cos(phi) * 0.112 * spread + 0.012, coatFront(y + head.position.y, z) - head.position.x + 0.012);
        beard.push([x, y, z, 0.035 * (1 - v * 0.35)]);
      }
      // white hair round the back, below the hat
      const hair = [];
      for (let i = 0; i < 45; i++) {
        const phi = lerp(1.75, Math.PI * 2 - 1.75, rand());
        hair.push([Math.cos(phi) * 0.118, lerp(-0.1, 0.03, rand()), Math.sin(phi) * 0.112]);
      }
      // hat: fur brim, floppy velvet cone, pom-pom at the tip
      const hatBase = 0.075;
      const { geo: hatGeo, tip } = hatGeometry(0.118, 0.44, 2.3);
      const hat = new THREE.Mesh(hatGeo, M.suit);
      hat.position.set(-0.005, hatBase, 0);
      hat.scale.z = 0.95;
      head.add(
        fluff(beard, 0.035),
        fluff(hair, 0.03),
        hat,
        fluff(ringPts(18, (a) => [Math.cos(a) * 0.123 - 0.005, hatBase + Math.cos(a) * 0.012, Math.sin(a) * 0.116]), 0.038),
        fluff(ringPts(7, (a) => [tip[0] - 0.005 + Math.cos(a) * 0.02, hatBase + tip[1] + Math.sin(a) * 0.02, Math.sin(a * 2) * 0.02]), 0.04),
      );

      santa.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      santa.userData = { body, legs, arms, upper, head, hand: arms[0].hand, stride: 5.5, reachAngle: 0.15, carryElbow: 0.35 };
      return santa;
    }

    // Walk cycle; fires onStep at each footfall. holding = 1 keeps arms[0] in its carrying pose.
    function poseWalk(fig, t, walking, holding) {
      const d = fig.userData;
      const ph = t * d.stride, s = walking ? Math.sin(ph) : 0, c = walking ? Math.cos(ph) : 0;
      d.legs.forEach((leg, i) => {
        const dir = i ? -1 : 1;
        leg.hip.rotation.z = dir * s * 0.4;
        leg.knee.rotation.z = -0.04 - Math.max(0, dir * c) * 0.7; // knee bends as that leg swings forward
      });
      // the free arm swings against its leg, elbow loosening on the forward swing
      d.arms[1].shoulder.rotation.set(0, 0, s * 0.4);
      d.arms[1].elbow.rotation.z = 0.25 + Math.max(0, s) * 0.3;
      d.arms[0].shoulder.rotation.set(0, 0, holding ? 0.35 + d.reachAngle + s * 0.04 : -s * 0.4);
      d.arms[0].elbow.rotation.z = holding ? d.carryElbow : 0.25 + Math.max(0, -s) * 0.3;
      d.body.position.y = -(1 - Math.cos(s * 0.4)) * 0.7;  // hips dip when the legs are apart
      d.upper.rotation.set(0, s * 0.07, -0.04);            // shoulders twist with the stride, slight forward lean
      d.head.rotation.set(0, -s * 0.05, 0);
      const sign = s >= 0 ? 1 : -1;
      if (walking && sign !== d.lastSign) d.onStep?.(sign);
      d.lastSign = sign;
    }

    // Sitting pose for the slide: legs out in front, arms thrown up and waving
    function poseRide(fig, time, phase, ride) {
      const d = fig.userData;
      d.legs.forEach((leg, i) => {
        leg.hip.rotation.z = 1.45 + Math.sin(time * 6 + phase + i * 2) * 0.07 * ride;
        leg.knee.rotation.z = -0.3;
      });
      d.arms.forEach((arm, i) => {
        // up and forward (clear of the face), spread apart, waving
        arm.shoulder.rotation.set((i ? -1 : 1) * (0.45 + Math.sin(time * 9 + phase * 3 + i) * 0.3 * ride), 0, 2.2);
        arm.elbow.rotation.z = 0.25;
      });
      d.upper.rotation.set(0, 0, 0.12); // leaning back a little
      d.head.rotation.set(0, 0, Math.sin(time * 5 + phase) * 0.1 * ride);
    }

    // four Santas take turns on the slide; each sits in a wrapper whose origin is his seat
    const kids = [0.0, 1.1, 2.2, 3.3].map((offset) => {
      const rig = makeSanta();
      rig.position.y = -0.85;
      const obj = new THREE.Group();
      obj.add(rig);
      return { offset, obj, rig };
    });
    const santa = makeSanta();
    santa.scale.setScalar(1.4);
    santa.visible = false;
    scene.add(santa);

    // golf club for the 4: hangs from a swing pivot in front of Santa's chest; his arms reach for the grip
    const golf = (() => {
      const pivot = new THREE.Group();
      pivot.position.set(0.1, 0.49, 0);
      pivot.visible = false;
      const club = new THREE.Group();
      const grip = new THREE.Vector3(0.06, -0.5, 0), head = new THREE.Vector3(0.34, -1.3, 0);
      const clubhead = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, 0.17), makeMat(C(0xc9d2e3), CHROME));
      clubhead.position.copy(head).add(new THREE.Vector3(0.02, 0, 0.04));
      club.add(
        new THREE.Mesh(rod(grip.toArray(), grip.clone().lerp(head, 0.25).toArray(), 0.03), makeMat(C(0x1c1c1c), MATTE)),
        new THREE.Mesh(rod(grip.toArray(), head.toArray(), 0.016), makeMat(C(0xc9d2e3), CHROME)),
        clubhead,
      );
      club.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      pivot.add(club);
      santa.userData.upper.add(pivot);
      return { pivot, club, grip, head };
    })();
    const BALL_R = 0.08;
    const golfBall = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 16),
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.2 }));
    golfBall.castShadow = true;
    golfBall.visible = false;
    scene.add(golfBall);

    // golfer's stance: feet apart, knees soft, bent over the ball; a = swing angle (0 = club at the ball,
    // negative = backswing away from the flag, positive = follow-through)
    const DOWN = new THREE.Vector3(0, -1, 0);
    function poseGolf(a) {
      const d = santa.userData;
      d.body.position.y = -0.04;
      d.legs.forEach((leg, i) => {
        leg.hip.rotation.set((i ? 1 : -1) * 0.12, 0, 0.12);
        leg.knee.rotation.z = -0.22;
      });
      d.upper.rotation.set(0, a * 0.25, -0.38);
      d.head.rotation.set(0, -a * 0.2, -0.1); // eyes stay down on the ball
      golf.pivot.rotation.set(a, 0, 0);
      santa.updateMatrixWorld(true);
      const gripWorld = golf.club.localToWorld(golf.grip.clone());
      const gripInUpper = d.upper.worldToLocal(gripWorld);
      for (const arm of d.arms) {
        arm.shoulder.quaternion.setFromUnitVectors(DOWN, gripInUpper.clone().sub(arm.shoulder.position).normalize());
        arm.elbow.rotation.set(0, 0, 0);
      }
      santa.updateMatrixWorld(true);
    }
    // stand him over the ball with the club sole resting on the grass; returns where the ball sits
    function addressBall() {
      golf.club.position.set(0, 0, 0);
      for (let i = 0; i < 3; i++) {
        poseGolf(0);
        const headY = golf.club.localToWorld(golf.head.clone()).y;
        golf.club.position.y += (GROUND_Y + 0.04 - headY) / santa.scale.y;
      }
      poseGolf(0);
      const head = golf.club.localToWorld(golf.head.clone());
      return new THREE.Vector3(head.x + 0.12, GROUND_Y + BALL_R, head.z + 0.04);
    }
    function resetFigure(fig) {
      const d = fig.userData;
      fig.rotation.set(0, 0, 0);
      d.body.position.y = 0;
      d.legs.forEach((leg) => leg.hip.rotation.set(0, 0, 0));
      d.upper.rotation.set(0, 0, 0);
      d.arms.forEach((arm) => arm.shoulder.rotation.set(0, 0, 0));
    }
    const WALK_SPEED = 0.75;

    // ---------- the stage: everything a digit turns into lives in this group ----------
    const stage = new THREE.Group();
    scene.add(stage);

    // ---------- 1 → rocket ----------
    const red = C(0xd92b2b);
    const finGeo = (angle) => transformed(new THREE.BoxGeometry(0.06, 0.7, 0.55), {
      pos: [Math.sin(angle) * 0.6, -0.75, Math.cos(angle) * 0.6], rot: [0, angle, 0],
    });
    const ROCKET_BOTTOM = -1.15;
    const rocket = buildModel([
      { share: 0.50, color: C(0xe9edf3), m: { metalness: 0.6, roughness: 0.3 }, geo: new THREE.CylinderGeometry(0.45, 0.45, 2.0, 48) },
      { share: 0.18, color: red, m: PAINTED, geo: new THREE.ConeGeometry(0.45, 0.9, 48).translate(0, 1.45, 0) },
      { share: 0.22, color: red, m: PAINTED, geos: [finGeo(0), finGeo((Math.PI * 2) / 3), finGeo((Math.PI * 4) / 3)] },
      { share: 0.10, color: C(0x4fd1ff), m: { metalness: 0.2, roughness: 0.05 }, geo: transformed(new THREE.SphereGeometry(0.2, 24, 16), { pos: [0, 0.4, 0.42], scale: [1, 1, 0.35] }) },
      // solid-only details
      { color: C(0xc7ccd6), m: STEEL, geo: new THREE.TorusGeometry(0.21, 0.035, 12, 32).translate(0, 0.4, 0.45) },
      { color: red, m: PAINTED, geo: new THREE.CylinderGeometry(0.456, 0.456, 0.14, 48).translate(0, 0.85, 0) },
      { color: C(0x30343c), m: { metalness: 0.9, roughness: 0.4 }, geo: new THREE.CylinderGeometry(0.28, 0.4, 0.18, 32).translate(0, -1.06, 0) },
    ]);
    // engine flame (hidden until ignition): scaled from the nozzle so it can flicker
    const flame = new THREE.Group();
    flame.position.y = ROCKET_BOTTOM;
    flame.visible = false;
    flame.add(
      new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.5, 24).rotateX(Math.PI).translate(0, -0.75, 0),
        new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.85, toneMapped: false })),
      new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.95, 24).rotateX(Math.PI).translate(0, -0.475, 0),
        new THREE.MeshBasicMaterial({ color: 0xfff2b0, toneMapped: false })),
    );
    const flameLight = new THREE.PointLight(0xff8a3c, 0, 12);
    flameLight.position.y = -0.5;
    flame.add(flameLight);
    rocket.group.add(flame);

    // exhaust smoke: soft sprites that grow and fade
    const SMOKE_N = 600;
    const smokePos = new Float32Array(SMOKE_N * 3);
    const smokeVel = new Float32Array(SMOKE_N * 3);
    const smokeLife = new Float32Array(SMOKE_N).fill(1); // 1 = dead
    const smokeGeo = new THREE.BufferGeometry();
    smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
    smokeGeo.setAttribute('aLife', new THREE.BufferAttribute(smokeLife, 1));
    const smokeMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uScale: { value: 1 } },
      vertexShader: /* glsl */ `
        uniform float uScale;
        attribute float aLife;
        varying float vLife;
        void main() {
          vLife = aLife;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aLife >= 1.0 ? 0.0 : uScale * mix(0.35, 1.7, aLife) / -mv.z;
        }
      `,
      fragmentShader: /* glsl */ `
        varying float vLife;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float a = smoothstep(0.5, 0.05, d) * pow(1.0 - vLife, 1.3) * 0.55;
          vec3 c = mix(vec3(1.0, 0.62, 0.2), vec3(0.82, 0.82, 0.84), smoothstep(0.0, 0.22, vLife));
          gl_FragColor = vec4(c, a);
          #include <colorspace_fragment>
        }
      `,
    });
    const smoke = new THREE.Points(smokeGeo, smokeMat);
    smoke.frustumCulled = false;
    scene.add(smoke);
    let smokeCursor = 0;
    function emitSmoke(x, y, n) {
      const nearGround = y - GROUND_Y < 0.6; // billows sideways on the pad, streams down in flight
      for (let k = 0; k < n; k++) {
        const i = (smokeCursor = (smokeCursor + 1) % SMOKE_N) * 3;
        const a = rand() * Math.PI * 2, sp = nearGround ? 1.5 + rand() * 2.5 : rand() * 0.6;
        smokePos.set([x + (rand() - 0.5) * 0.3, y + rand() * 0.2, (rand() - 0.5) * 0.3], i);
        smokeVel.set([Math.cos(a) * sp, nearGround ? rand() * 0.4 : -(2 + rand() * 2), Math.sin(a) * sp * 0.6], i);
        smokeLife[i / 3] = 0;
      }
    }
    function updateSmoke(dt) {
      for (let n = 0; n < SMOKE_N; n++) {
        if (smokeLife[n] >= 1) continue;
        const i = n * 3;
        smokeLife[n] = Math.min(1, smokeLife[n] + dt / 2.2);
        smokePos[i] += smokeVel[i] * dt;
        smokePos[i + 1] += smokeVel[i + 1] * dt;
        smokePos[i + 2] += smokeVel[i + 2] * dt;
        smokeVel[i] *= 1 - 1.2 * dt;
        smokeVel[i + 2] *= 1 - 1.2 * dt;
        smokeVel[i + 1] += (0.5 - smokeVel[i + 1]) * dt * 1.5; // slows, then drifts upward
        if (smokePos[i + 1] < GROUND_Y + 0.1) smokePos[i + 1] = GROUND_Y + 0.1;
      }
      smokeGeo.attributes.position.needsUpdate = true;
      smokeGeo.attributes.aLife.needsUpdate = true;
    }

    // ---------- 2 and 3 → see-through tube slides shaped like the digit, with Santas riding down ----------
    const SLIDE_SCALE = 1.2, SLIDE_OFFSET = 0.15, TUBE_R = 0.3;
    // tinted clear plastic, so the riders are visible inside
    const CLEAR = { transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false, roughness: 0.12 };

    // pieces = [{ pts, color }] in digit space, laid end to end; the riders follow all of them in order.
    // ground = height the ladder and legs stand on (model space, before SLIDE_OFFSET).
    function makeTubeSlide(pieces, ground, supportsAt) {
      const scaled = pieces.map((piece) => ({ ...piece, pts: piece.pts.map((p) => p.clone().multiplyScalar(SLIDE_SCALE)) }));
      const curve = new THREE.CatmullRomCurve3(scaled.flatMap((piece, i) => (i ? piece.pts.slice(1) : piece.pts)));
      const start = curve.getPointAt(0);
      const platY = start.y - TUBE_R;
      const ladderX = start.x - 0.75;
      const ladderParts = [];
      for (const z of [0.35, -0.35]) ladderParts.push(rod([ladderX - 0.35, ground, z], [ladderX, platY, z]));
      for (let i = 1; i <= 8; i++) {
        const t = i / 9;
        const x = ladderX - 0.35 + 0.35 * t, y = ground + (platY - ground) * t;
        ladderParts.push(rod([x, y, 0.35], [x, y, -0.35], 0.03));
      }
      const supportParts = [];
      for (const u of supportsAt) {
        const p = curve.getPointAt(u);
        for (const z of [0.18, -0.18]) supportParts.push(rod([p.x, ground, z], [p.x, p.y - TUBE_R, z], 0.035));
      }
      const tubeShare = 0.72 / scaled.length;
      const model = buildModel([
        ...scaled.map((piece) => ({
          share: tubeShare, color: C(piece.color), m: CLEAR,
          geo: new THREE.TubeGeometry(new THREE.CatmullRomCurve3(piece.pts), 160, TUBE_R, 24, false),
        })),
        { share: 0.08, color: C(0xffc21a), m: PAINTED, geo: transformed(new THREE.BoxGeometry(0.8, 0.06, 0.8), { pos: [start.x - 0.4, platY, 0] }) },
        { share: 0.12, color: C(0xc9d2e3), m: STEEL, geos: ladderParts },
        { share: 0.08, color: C(0xc9d2e3), m: STEEL, geos: supportParts },
      ], SLIDE_OFFSET);
      return { model, curve, restY: GROUND_Y - (ground + SLIDE_OFFSET) };
    }

    // "3": the upper loop red, the lower loop blue
    const midThree = Math.floor(threePts.length / 2);
    const slide3 = makeTubeSlide([
      { pts: threePts.slice(0, midThree + 1), color: 0xff3d43 },
      { pts: threePts.slice(midThree), color: 0x1f8fe8 },
    ], -2.05, [0.0, 0.3, 0.5, 0.72]);

    // "2": red half circle, yellow drop, then a long blue horizontal pipe out along the ground.
    // The sharp bottom corner of the digit is rounded off so riders (and the tube) can get round it.
    const twoCorner = twoBL.clone();
    const twoArcEnd = arcPts[arcPts.length - 1];
    const CORNER = 0.45;
    const intoCorner = twoCorner.clone().add(twoArcEnd.clone().sub(twoCorner).setLength(CORNER));
    const outOfCorner = twoCorner.clone().add(new THREE.Vector3(CORNER, 0, 0));
    const roundCorner = new THREE.QuadraticBezierCurve3(intoCorner, twoCorner, outOfCorner).getPoints(10);
    const slide2 = makeTubeSlide([
      { pts: arcPts, color: 0xff3d43 },
      { pts: [...new THREE.LineCurve3(twoArcEnd, intoCorner).getPoints(8), ...roundCorner.slice(1)], color: 0xffb81f },
      { pts: new THREE.LineCurve3(outOfCorner, twoBR).getPoints(10), color: 0x1f8fe8 },
    ], -1.35 * SLIDE_SCALE - TUBE_R - 0.06, [0.0, 0.32, 0.5]);

    const kidGroup = new THREE.Group();
    kidGroup.visible = false;
    kids.forEach((k) => kidGroup.add(k.obj));
    stage.add(kidGroup);
    const SLIDE_CYCLE = 4.4;
    function startRiders() {
      // Santas already part-way down at the start stay quiet until their next turn
      kids.forEach((k) => { k.lastWhee = k.offset % SLIDE_CYCLE >= 0.5 ? 0 : -1; });
      kidGroup.visible = true;
    }
    function updateKids(time, slideCurve) {
      for (const k of kids) {
        const cycle = Math.floor((time + k.offset) / SLIDE_CYCLE);
        const c = (time + k.offset) % SLIDE_CYCLE;
        let u, scale = 0.36; // small enough to sit inside the tube
        if (c < 0.5) { u = 0; scale *= c / 0.5; }                             // pop in on the platform
        else if (c < 3.8) { const s = (c - 0.5) / 3.3; u = s * (0.4 + 0.6 * s); } // ride the whole tube, speeding up
        else { u = 1; scale *= 1 - (c - 3.8) / 0.6; }                         // shrink away at the exit
        if (c >= 0.5 && k.lastWhee !== cycle) {
          k.lastWhee = cycle;
          sfx.whee();
        }
        const p = slideCurve.getPointAt(u);
        const t = slideCurve.getTangentAt(u);
        // seated on the tube's inner wall: shifted off the centre line, away from the rider's own "up"
        k.obj.position.set(p.x + t.y * TUBE_R * 0.65, p.y + SLIDE_OFFSET - t.x * TUBE_R * 0.65, 0);
        k.obj.rotation.z = Math.atan2(t.y, t.x); // legs point along the slide
        k.obj.scale.setScalar(Math.max(0.001, scale));
        // wave arms and bob head while riding
        poseRide(k.rig, time, k.offset, u > 0 && u < 1 ? 1 : 0.3);
      }
    }

    // ---------- 4 → flag: the stem is the pole, the triangle is a cloth pennant flying left ----------
    const FLAG_X = 0.32, FLAG_LEN = 1.32;
    const clothGeo = new THREE.PlaneGeometry(1, 1, 28, 12);
    const clothRest = []; // per vertex: distance from the pole (0..1) and resting position
    {
      const pos = clothGeo.attributes.position, uv = clothGeo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const u = uv.getX(i), v = uv.getY(i);
        const x = FLAG_X - FLAG_LEN * u, y = -0.35 + v * 1.8 * (1 - u);
        pos.setXYZ(i, x, y, 0);
        clothRest.push({ u, x, y });
      }
      clothGeo.computeVertexNormals();
    }
    const flag = buildModel([
      { share: 0.72, color: C(0xe3262b), m: { side: THREE.DoubleSide, roughness: 0.85 }, geo: clothGeo },
      { share: 0.22, color: C(0xc9d2e3), m: STEEL, geo: rod([0.35, -1.6, 0], [0.35, 1.55, 0], 0.05) },
      { share: 0.06, color: C(0xe0a800), m: BRASS, geo: new THREE.SphereGeometry(0.1, 24, 16).translate(0.35, 1.62, 0) },
      // putting green round the cup the flag stands in
      { color: C(0x63c94f), m: { roughness: 0.8 }, geo: new THREE.CircleGeometry(1.5, 48).rotateX(-Math.PI / 2).translate(0.35, -1.588, 0) },
      { color: C(0xf2f2f2), m: MATTE, geo: new THREE.RingGeometry(0.13, 0.16, 32).rotateX(-Math.PI / 2).translate(0.35, -1.584, 0) },
      { color: C(0x0c0c0c), m: MATTE, geo: new THREE.CircleGeometry(0.13, 32).rotateX(-Math.PI / 2).translate(0.35, -1.583, 0) },
    ]);
    function waveCloth(t, strength) {
      const pos = clothGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const { u, x, y } = clothRest[i];
        const ph = u * 5 - t * 6 + y * 1.5; // ripple runs from the pole out to the free tip
        const amp = u * strength;
        pos.setXYZ(i,
          x + (Math.cos(ph) - 1) * 0.06 * amp,
          y + Math.sin(u * 4 - t * 5) * 0.06 * amp,
          (Math.sin(ph) * 0.3 + Math.sin(u * 11 - t * 10) * 0.05) * amp);
      }
      pos.needsUpdate = true;
      clothGeo.computeVertexNormals();
    }

    // ---------- 5 → tower crane loading gifts onto Santa's cart: top bar = jib, stem = cable, belly = hook ----------
    const CRANE_OFFSET = -0.15, CRANE_REST = 1.1; // the whole thing hoists up so the gifts have room to travel
    const CABLE_TOP = 1.3, CABLE_LEN = 1.05;
    const GIFT = { w: 0.6, h: 0.5, d: 0.5, y: -1.88 };              // the gift hanging under the hook (model space)
    const GIFT_BOTTOM0 = GIFT.y - GIFT.h / 2 + CRANE_OFFSET + CRANE_REST; // world height of its base with the hook at rest
    const craneYellow = C(0xffb300);
    const jibParts = [rod([-1.3, 1.55, 0], [1.5, 1.55, 0], 0.04), rod([-1.3, 1.3, 0], [1.5, 1.3, 0], 0.04)];
    for (let x = -1.3; x < 1.5; x += 0.35) {
      jibParts.push(rod([x, 1.3, 0], [x + 0.175, 1.55, 0], 0.025), rod([x + 0.175, 1.55, 0], [x + 0.35, 1.3, 0], 0.025));
    }
    const hookTip = bellyPts[bellyPts.length - 1];

    // wrapped presents: paper box, two ribbon bands and a bow on top
    const GIFT_COLORS = [[0xd61f2c, 0xf2c230], [0x1f9e55, 0xd61f2c], [0x2a6fd6, 0xf4f4f4]];
    const ribbonMat = (hex) => new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.3, sheen: 1, sheenColor: C(0xffffff), sheenRoughness: 0.3 });
    function giftDecorGeos({ w, h, d }, y = 0) {
      const top = y + h / 2;
      return [
        new THREE.BoxGeometry(w + 0.012, h + 0.012, 0.07).translate(0, y, 0),
        new THREE.BoxGeometry(0.07, h + 0.012, d + 0.012).translate(0, y, 0),
        new THREE.TorusGeometry(0.075, 0.022, 8, 20).rotateY(Math.PI / 2).rotateZ(0.6).translate(-0.06, top + 0.06, 0),
        new THREE.TorusGeometry(0.075, 0.022, 8, 20).rotateY(Math.PI / 2).rotateZ(-0.6).translate(0.06, top + 0.06, 0),
        new THREE.SphereGeometry(0.035, 12, 8).translate(0, top + 0.02, 0),
      ];
    }
    function makeGift([paper, ribbon]) {
      const g = new THREE.Group();
      const box = new THREE.Mesh(new THREE.BoxGeometry(GIFT.w, GIFT.h, GIFT.d), new THREE.MeshStandardMaterial({ color: paper, roughness: 0.55 }));
      g.add(box);
      const rm = ribbonMat(ribbon);
      for (const geo of giftDecorGeos(GIFT)) g.add(new THREE.Mesh(geo, rm));
      g.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
      return g;
    }
    const hookPaper = new THREE.MeshStandardMaterial({ color: GIFT_COLORS[0][0], roughness: 0.55 });
    const hookRibbon = ribbonMat(GIFT_COLORS[0][1]);
    const crane = buildModel([
      { share: 0.30, color: craneYellow, m: PAINTED, geos: jibParts },
      { share: 0.06, color: C(0x555b66), m: PAINTED, name: 'trolley', geo: new THREE.BoxGeometry(0.35, 0.22, 0.3).translate(-0.66, 1.3, 0) },
      { share: 0.08, color: C(0x70777f), m: STEEL, name: 'cable', geo: rod([-0.66, CABLE_TOP, 0], [-0.68, CABLE_TOP - CABLE_LEN, 0], 0.025) },
      { share: 0.30, color: C(0xb9c1cc), m: STEEL, name: 'hook', geo: new THREE.TubeGeometry(bellyCurve, 160, 0.13, 16, false) },
      { share: 0.03, color: C(0xb9c1cc), m: STEEL, name: 'hook', geos: [new THREE.SphereGeometry(0.13, 16, 12).translate(hookTip.x, hookTip.y, 0), new THREE.SphereGeometry(0.13, 16, 12).translate(-0.68, 0.25, 0)] },
      { share: 0.05, color: C(0x70777f), m: STEEL, name: 'hook', geos: [-1, 1].map((sx) => rod([0, -1.3, 0], [sx * 0.24, GIFT.y + GIFT.h / 2, 0], 0.02)) }, // slings
      { share: 0.18, color: C(GIFT_COLORS[0][0]), name: 'gift', material: hookPaper, geo: new THREE.BoxGeometry(GIFT.w, GIFT.h, GIFT.d).translate(0, GIFT.y, 0) },
      { color: C(GIFT_COLORS[0][1]), name: 'gift', material: hookRibbon, geos: giftDecorGeos(GIFT, GIFT.y) },
    ], CRANE_OFFSET);
    setPivot(crane.named.cable, -0.66, CABLE_TOP, 0);
    crane.named.hook.add(crane.named.gift); // the gift travels with the hook

    // gifts waiting on the ground for the crane, and Santa's cart they get loaded onto (world space)
    const PILE_X = [-0.5, 0.25];
    const pile = PILE_X.map((x, i) => {
      const g = makeGift(GIFT_COLORS[i + 1]);
      g.position.set(x, GROUND_Y + GIFT.h / 2, 0);
      g.visible = false;
      scene.add(g);
      return g;
    });
    const CART_X = 1.7, CART_BED = 0.5; // bed top height above the ground
    const CART_SLOTS = [[-0.35, 0], [0.35, 0], [0, 1]]; // [x on the bed, layer]
    const HANDLE = { x: 1.3, y: 1.3 };                   // where Santa holds the handle (cart space)
    const cart = (() => {
      const group = new THREE.Group();
      group.visible = false;
      const wood = makeMat(C(0x9a5b2c), WOOD), red = makeMat(C(0xc8161d), PAINTED), iron = makeMat(C(0x3a3d42), STEEL);
      const add = (geo, m, parent = group) => {
        const mesh = new THREE.Mesh(geo, m);
        mesh.castShadow = mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      };
      add(new THREE.BoxGeometry(1.5, 0.1, 0.85).translate(0, CART_BED - 0.05, 0), wood);
      for (const z of [0.41, -0.41]) add(new THREE.BoxGeometry(1.5, 0.16, 0.04).translate(0, CART_BED + 0.07, z), red); // side rails
      for (const x of [0.73, -0.73]) add(new THREE.BoxGeometry(0.04, 0.16, 0.85).translate(x, CART_BED + 0.07, 0), red);
      for (const x of [0.5, -0.5]) add(rod([x, 0.22, 0.48], [x, 0.22, -0.48], 0.03), iron); // axles
      const wheels = [];
      for (const x of [0.5, -0.5]) for (const z of [0.46, -0.46]) {
        const wheel = new THREE.Group();
        wheel.position.set(x, 0.22, z);
        add(new THREE.TorusGeometry(0.2, 0.035, 10, 32), red, wheel);
        add(new THREE.CylinderGeometry(0.05, 0.05, 0.08, 16).rotateX(Math.PI / 2), iron, wheel);
        for (let k = 0; k < 3; k++) add(new THREE.BoxGeometry(0.4, 0.025, 0.025).rotateZ((k * Math.PI) / 3), red, wheel);
        group.add(wheel);
        wheels.push(wheel);
      }
      // pull handle: two arms meeting at a T-grip
      for (const z of [0.2, -0.2]) add(rod([0.74, CART_BED - 0.08, z], [HANDLE.x, HANDLE.y, 0], 0.025), iron);
      add(rod([HANDLE.x, HANDLE.y, 0.18], [HANDLE.x, HANDLE.y, -0.18], 0.035), makeMat(C(0x1c1c1c), MATTE));
      const loaded = CART_SLOTS.map(([x, layer], i) => {
        const g = makeGift(GIFT_COLORS[i]);
        g.position.set(x, CART_BED + GIFT.h / 2 + layer * GIFT.h, 0);
        g.visible = false;
        group.add(g);
        return g;
      });
      scene.add(group);
      return { group, wheels, loaded };
    })();
    function placeCart(x, rolled) {
      cart.group.position.set(x, GROUND_Y, 0);
      cart.wheels.forEach((w) => { w.rotation.z = -rolled / 0.2; });
    }

    // the tower that holds the jib up: solid-only, rises out of the ground once the crane has formed.
    // Built in world coordinates, then hung in the stage so it lines up when the stage sits at CRANE_REST.
    const towerPivot = new THREE.Group();
    towerPivot.position.set(-1.6, GROUND_Y - CRANE_REST, 0);
    towerPivot.visible = false;
    {
      const inner = new THREE.Group();
      inner.position.set(1.6, -GROUND_Y, 0);
      towerPivot.add(inner);
      const jibY = CABLE_TOP + CRANE_OFFSET + CRANE_REST; // world height of the jib's lower chord
      const top = jibY + 0.45;
      const geos = [];
      for (const x of [-1.8, -1.4]) for (const z of [0.2, -0.2]) geos.push(rod([x, GROUND_Y, z], [x, top, z], 0.04));
      for (let y = GROUND_Y, i = 0; y < top - 0.2; y += 0.45, i++) {
        const y2 = Math.min(top, y + 0.45);
        const [xa, xb] = i % 2 ? [-1.8, -1.4] : [-1.4, -1.8];
        for (const z of [0.2, -0.2]) geos.push(rod([xa, y, z], [xb, y2, z], 0.022));
        for (const x of [-1.8, -1.4]) geos.push(rod([x, y2, 0.2], [x, y2, -0.2], 0.022));
      }
      // jib root, counter-jib, apex and tie rods
      for (const y of [jibY, jibY + 0.25]) geos.push(rod([-1.8, y, 0], [-1.3, y, 0], 0.04));
      for (const z of [0.15, -0.15]) geos.push(rod([-1.8, jibY, z], [-2.9, jibY, z], 0.035));
      const apex = [-1.6, top + 0.55, 0];
      for (const x of [-1.8, -1.4]) for (const z of [0.2, -0.2]) geos.push(rod([x, top, z], apex, 0.03));
      geos.push(rod(apex, [1.5, jibY + 0.25, 0], 0.012), rod(apex, [-2.9, jibY, 0], 0.012));
      const add = (geo, color, m) => {
        const mesh = new THREE.Mesh(geo, makeMat(color, m));
        mesh.castShadow = mesh.receiveShadow = true;
        inner.add(mesh);
      };
      const yellowMat = makeMat(craneYellow, PAINTED);
      for (const g of geos) {
        const mesh = new THREE.Mesh(g, yellowMat);
        mesh.castShadow = true;
        inner.add(mesh);
      }
      add(new THREE.BoxGeometry(0.55, 0.4, 0.45).translate(-2.65, jibY - 0.22, 0), C(0x8d9299), MATTE);    // counterweight
      add(new THREE.BoxGeometry(0.42, 0.42, 0.42).translate(-1.6, jibY - 0.35, 0.42), C(0xf2f4f7), PAINTED); // cab
      add(new THREE.BoxGeometry(0.3, 0.2, 0.02).translate(-1.6, jibY - 0.3, 0.64), C(0x4fd1ff), { metalness: 0.2, roughness: 0.05 });
      add(new THREE.BoxGeometry(1.3, 0.16, 1.3).translate(-1.6, GROUND_Y + 0.08, 0), C(0x9a9fa6), MATTE);   // concrete pad
    }
    stage.add(towerPivot);

    // ---------- 6 → big referee whistle: loop = round chamber, top stroke = mouthpiece ----------
    const mouthCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.6, -0.1, 0), new THREE.Vector3(-0.45, 0.6, 0),
      new THREE.Vector3(0.05, 1.2, 0), new THREE.Vector3(0.7, 1.45, 0),
    ]);
    const whistleSilver = C(0xd5dde8);
    const WHISTLE_BOTTOM = -1.4;
    const whistle = buildModel([
      { share: 0.50, color: whistleSilver, m: CHROME, geo: new THREE.CylinderGeometry(0.8, 0.8, 0.7, 64).rotateX(Math.PI / 2).translate(0, -0.6, 0) },
      { share: 0.28, color: whistleSilver, m: { ...CHROME, side: THREE.DoubleSide }, geo: transformed(new THREE.TubeGeometry(mouthCurve, 80, 0.24, 24, false), { scale: [1, 1, 1.3] }) },
      { share: 0.07, color: C(0x15181d), m: MATTE, geo: new THREE.BoxGeometry(0.4, 0.06, 0.5).translate(-0.15, 0.2, 0) }, // sound slot
      { share: 0.05, color: C(0xe0a800), m: BRASS, geo: new THREE.TorusGeometry(0.18, 0.04, 12, 32).translate(0.95, -0.95, 0) }, // ring
      { share: 0.10, color: C(0xd92b2b), m: MATTE, geo: new THREE.TubeGeometry(new THREE.CatmullRomCurve3([ // lanyard trailing on the ground
        new THREE.Vector3(1.05, -1.1, 0), new THREE.Vector3(1.3, -1.32, 0.1), new THREE.Vector3(1.7, -1.36, 0), new THREE.Vector3(2.1, -1.36, -0.15),
      ]), 60, 0.04, 8, false) },
    ]);

    // sound-wave arcs fanning out from the slot
    const soundArcs = Array.from({ length: 3 }, () => {
      const pts = [];
      for (let i = 0; i < 260; i++) {
        const a = THREE.MathUtils.degToRad(-15 + rand() * 110);
        const r = 1 + (rand() - 0.5) * 0.06;
        pts.push(Math.cos(a) * r, Math.sin(a) * r, (rand() - 0.5) * 0.3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const arc = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.07, map: dotTex, color: 0xffffff, transparent: true, depthWrite: false }));
      arc.position.set(-0.15, 0.3, 0);
      return arc;
    });
    const soundGroup = new THREE.Group();
    soundGroup.visible = false;
    soundArcs.forEach((a) => soundGroup.add(a));
    stage.add(soundGroup);

    // ---------- 7 → walking stick: top bar = handle, diagonal = shaft ----------
    const CANE_BOTTOM = -1.42;
    const cane = buildModel([
      { share: 0.25, color: C(0x6e4320), m: WOOD, geo: rod([-0.7, 1.4, 0], [0.55, 1.4, 0], 0.11) },  // handle
      { share: 0.05, color: C(0xd4a017), m: BRASS, geo: new THREE.SphereGeometry(0.13, 24, 16).translate(-0.75, 1.4, 0) }, // brass knob
      { share: 0.05, color: C(0xd4a017), m: BRASS, geo: rod([0.48, 1.32, 0], [0.48, 1.1, 0], 0.1) },  // brass collar
      { share: 0.58, color: C(0x8f5a2a), m: WOOD, geo: rod([0.5, 1.35, 0], [-0.22, -1.25, 0], 0.08) },  // wooden shaft
      { share: 0.07, color: C(0x1c1c1c), m: MATTE, geo: rod([-0.22, -1.25, 0], [-0.25, CANE_BOTTOM, 0], 0.09) }, // rubber tip
      { color: C(0x6e4320), m: WOOD, geo: new THREE.SphereGeometry(0.11, 16, 12).translate(0.55, 1.4, 0) }, // rounded handle end
    ]);

    // ---------- 8 → snowman: bottom loop = body, top loop = head ----------
    const snowWhite = C(0xf4f8ff);
    const coal = C(0x111111);
    const SNOWMAN_BOTTOM = -0.65 - 0.92 - 0.1 + 0.12; // sunk a little into the snow
    const snowman = buildModel([
      { share: 0.40, color: snowWhite, m: MATTE, geo: new THREE.SphereGeometry(0.92, 48, 32).translate(0, -0.65, 0) },
      { share: 0.24, color: snowWhite, m: MATTE, geo: new THREE.SphereGeometry(0.62, 48, 32).translate(0, 0.78, 0) },
      // top hat + red band
      { share: 0.08, color: C(0x1b1b1f), m: MATTE, geos: [
        new THREE.CylinderGeometry(0.38, 0.38, 0.5, 32).translate(0, 1.62, 0),
        new THREE.CylinderGeometry(0.6, 0.6, 0.05, 32).translate(0, 1.35, 0),
      ] },
      { share: 0.02, color: C(0xd92b2b), m: MATTE, geo: new THREE.CylinderGeometry(0.39, 0.39, 0.1, 32, 1, true).translate(0, 1.44, 0) },
      // carrot nose (points at the camera), coal eyes, coal smile
      { share: 0.03, color: C(0xff7a14), geo: new THREE.ConeGeometry(0.08, 0.45, 16).rotateX(Math.PI / 2).translate(0, 0.78, 0.82) },
      { share: 0.02, color: coal, geos: [0.18, -0.18].map((x) => new THREE.SphereGeometry(0.06, 12, 8).translate(x, 0.95, 0.56)) },
      { share: 0.02, color: coal, geos: [-0.24, -0.12, 0, 0.12, 0.24].map((x) => new THREE.SphereGeometry(0.04, 10, 8).translate(x, 0.55 + Math.abs(x) * 0.5, 0.55)) },
      // scarf + coal buttons
      { share: 0.06, color: C(0xd92b2b), m: MATTE, geos: [
        new THREE.TorusGeometry(0.5, 0.1, 12, 40).rotateX(Math.PI / 2).translate(0, 0.25, 0),
        rod([0.25, 0.22, 0.45], [0.35, -0.3, 0.6], 0.08),
      ] },
      { share: 0.03, color: coal, geos: [-0.2, -0.55, -0.9].map((y) => new THREE.SphereGeometry(0.07, 12, 8).translate(0, y, 0.9 - Math.abs(y + 0.55) * 0.35)) },
      // stick arms with twig fingers: left is still, right waves
      { share: 0.05, color: C(0x5c3a1c), m: MATTE, geos: [
        rod([-0.8, -0.05, 0], [-1.6, 0.5, 0], 0.04), rod([-1.45, 0.4, 0], [-1.7, 0.4, 0], 0.025), rod([-1.5, 0.43, 0], [-1.6, 0.7, 0], 0.025),
      ] },
      { share: 0.05, color: C(0x5c3a1c), m: MATTE, name: 'armR', geos: [
        rod([0.8, -0.05, 0], [1.55, 0.75, 0], 0.04), rod([1.42, 0.6, 0], [1.7, 0.66, 0], 0.025), rod([1.46, 0.65, 0], [1.45, 0.95, 0], 0.025),
      ] },
    ], -0.1);
    setPivot(snowman.named.armR, 0.8, -0.05, 0);

    // falling snow
    const FLAKES = 900;
    const flakePos = new Float32Array(FLAKES * 3);
    for (let i = 0; i < FLAKES; i++) flakePos.set([(rand() - 0.5) * 16, GROUND_Y + rand() * 8, -5 + rand() * 9], i * 3);
    const flakeGeo = new THREE.BufferGeometry();
    flakeGeo.setAttribute('position', new THREE.BufferAttribute(flakePos, 3));
    const snowfall = new THREE.Points(flakeGeo, new THREE.PointsMaterial({ size: 0.09, map: dotTex, color: 0xffffff, transparent: true, depthWrite: false }));
    snowfall.visible = false;
    snowfall.frustumCulled = false;
    scene.add(snowfall);
    function updateSnow(dt, time) {
      for (let i = 0; i < FLAKES; i++) {
        const k = i * 3;
        flakePos[k + 1] -= dt * (0.5 + (i % 7) * 0.09);
        flakePos[k] += Math.sin(time + i) * dt * 0.15;
        if (flakePos[k + 1] < GROUND_Y) flakePos[k + 1] = GROUND_Y + 8;
      }
      flakeGeo.attributes.position.needsUpdate = true;
    }

    // ---------- 8 extra: Santa's selfie stick and phone, and the camera that takes the picture ----------
    const selfie = (() => {
      const phone = new THREE.Group();
      const add = (geo, m, z) => {
        const mesh = new THREE.Mesh(geo, m);
        mesh.position.z = z;
        mesh.castShadow = true;
        phone.add(mesh);
      };
      add(new THREE.BoxGeometry(0.2, 0.38, 0.03), makeMat(C(0xd92b2b), PAINTED), 0);                     // case
      add(new THREE.BoxGeometry(0.18, 0.35, 0.005), makeMat(C(0x10131a), { roughness: 0.05 }), 0.017); // screen (faces the people)
      add(new THREE.CylinderGeometry(0.02, 0.02, 0.01, 16).rotateX(Math.PI / 2), makeMat(C(0x222222), { roughness: 0.05 }), 0.02);
      const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 12).translate(0, 0.5, 0), makeMat(C(0x20242b), STEEL));
      stick.castShadow = true;
      const kit = new THREE.Group();
      kit.add(phone, stick);
      kit.visible = false;
      scene.add(kit);
      const cam = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
      const photoEl = document.getElementById('photo');
      return { kit, phone, stick, cam, photoEl, photoCtx: photoEl.querySelector('canvas').getContext('2d'), flashEl: document.getElementById('flash') };
    })();
    function hidePhoto() { selfie.photoEl.classList.remove('show'); }

    // ---------- 9 → lollipop: loop = swirly candy, stem = stick ----------
    const LOLLI_BOTTOM = -1.45;
    const swirlHex = ['#ff3d94', '#ffffff', '#ffd21f', '#2fb4ff'];
    const swirlColors = swirlHex.map((h) => C(h));
    const stripeAt = (angle, r01) => Math.floor((((angle / (Math.PI * 2)) * 4 + r01 * 3.75) % 4 + 4) % 4);
    function sampleCandy(n) {
      // disc faces + rim, coloured in spiral stripes
      const out = [];
      for (let i = 0; i < n; i++) {
        const onRim = rand() < 0.15;
        const r = onRim ? 0.75 : 0.75 * Math.sqrt(rand());
        const a = rand() * Math.PI * 2;
        const z = onRim ? (rand() - 0.5) * 0.28 : (rand() < 0.5 ? 0.14 : -0.14);
        out.push({ p: new THREE.Vector3(Math.cos(a) * r, 0.72 + Math.sin(a) * r, z), c: swirlColors[stripeAt(a, r / 0.75)] });
      }
      return out;
    }
    const swirlTex = canvasTexture(512, (g, s) => {
      const img = g.createImageData(s, s);
      const rgb = swirlColors.map((c) => c.clone().convertLinearToSRGB());
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          const dx = (x / s) * 2 - 1, dy = 1 - (y / s) * 2;
          const a = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
          const c = rgb[stripeAt(a, Math.min(1, Math.hypot(dx, dy)))];
          img.data.set([c.r * 255, c.g * 255, c.b * 255, 255], (y * s + x) * 4);
        }
      }
      g.putImageData(img, 0, 0);
    });
    const CANDY_N = Math.round(COUNT * 0.72);
    const lollipop = buildModel([
      { share: 0.85, color: C(0xf4f4f4), m: { roughness: 0.6 }, geo: rod([0.62, 0.3, 0], [0.62, LOLLI_BOTTOM, 0], 0.06) },
      { share: 0.15, color: C(0xd92b2b), m: MATTE, geos: [ // ribbon bow on the stick
        new THREE.SphereGeometry(0.09, 12, 8).translate(0.62, 0.0, 0),
        new THREE.ConeGeometry(0.1, 0.22, 12).rotateZ(Math.PI / 2).translate(0.75, 0.0, 0),
        new THREE.ConeGeometry(0.1, 0.22, 12).rotateZ(-Math.PI / 2).translate(0.49, 0.0, 0),
      ] },
    ], 0, COUNT - CANDY_N);
    lollipop.points.unshift(...sampleCandy(CANDY_N));
    {
      const glaze = { roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 };
      const face = new THREE.MeshPhysicalMaterial({ map: swirlTex, ...glaze });
      const candy = new THREE.Mesh(
        new THREE.CylinderGeometry(0.75, 0.75, 0.28, 64).rotateX(Math.PI / 2).translate(0, 0.72, 0),
        [new THREE.MeshPhysicalMaterial({ color: 0xff3d94, ...glaze }), face, face]);
      candy.castShadow = true;
      lollipop.group.add(candy);
    }

    // ---------- particle system: carries the digit's shape across to the object's shape ----------
    const geometry = new THREE.BufferGeometry();
    const attr = (name, size) => {
      const a = new THREE.BufferAttribute(new Float32Array(COUNT * size), size);
      geometry.setAttribute(name, a);
      return a;
    };
    const aPos = attr('position', 3);
    const aTarget = attr('aTarget', 3);
    const aColorA = attr('aColorA', 3);
    const aColorB = attr('aColorB', 3);
    const aRandom = attr('aRandom', 3);
    const aDelay = attr('aDelay', 1);

    for (let i = 0; i < COUNT; i++) {
      const dir = new THREE.Vector3().randomDirection().multiplyScalar(0.5 + rand());
      aRandom.setXYZ(i, dir.x, dir.y, dir.z);
    }

    function loadMorph(from, to) {
      for (let i = 0; i < COUNT; i++) {
        const a = from[i], b = to[i];
        aPos.setXYZ(i, a.p.x, a.p.y, a.p.z);
        aTarget.setXYZ(i, b.p.x, b.p.y, b.p.z);
        aColorA.setXYZ(i, a.c.r, a.c.g, a.c.b);
        aColorB.setXYZ(i, b.c.r, b.c.g, b.c.b);
        // delay sweeps top-to-bottom, with jitter
