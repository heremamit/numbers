          const c = Math.max(0, t - 1.3) % PERIOD;
          const seg = t < 1.3 ? -1 : c < DOWN ? 0 : c < DOWN + WAIT ? 1 : c < DOWN * 2 + WAIT ? 2 : 3;
          const drop = seg === 0 ? easeInOut(c / DOWN) : seg === 1 ? 1 : seg === 2 ? 1 - easeInOut((c - DOWN - WAIT) / DOWN) : 0;
          if (seg !== this.seg) {
            if (seg === 1) sfx.thud();   // crate touches down
            if (seg === 3) sfx.clank();  // hook back at the top
            this.motor.setPitch(seg === 2 ? 76 : 58);
            this.motor.set(seg === 0 || seg === 2 ? 0.1 : 0, 0.15);
            this.seg = seg;
          }
          crane.named.hook.position.y = -drop * CRANE_MAX_DROP;
          crane.named.cable.scale.y = (CABLE_LEN + drop * CRANE_MAX_DROP) / CABLE_LEN;
        },
      },
      6: {
        digit: buildDigit([sixPath]), model: whistle, restY: GROUND_Y - WHISTLE_BOTTOM,
        enter() { this.blows = -1; soundGroup.visible = true; status(again('TWEEEET! 📯')); },
        update(dt, t) {
          // blow for 1.2s, rest 1s, repeat: the whistle shakes and sound waves fan out
          const BLOW = 1.2, CYCLE = 2.2, c = t % CYCLE, blowing = c < BLOW;
          const blow = Math.floor(t / CYCLE);
          if (blow !== this.blows) {
            this.blows = blow;
            sfx.whistle(BLOW);
          }
          stage.position.x = blowing ? (rand() - 0.5) * 0.04 : 0;
          stage.position.y = this.restY + (blowing ? rand() * 0.03 : 0);
          stage.rotation.z = blowing ? Math.sin(now * 60) * 0.012 : 0;
          soundArcs.forEach((arc, i) => {
            const s = blowing ? ((c / BLOW) * 2 + i / soundArcs.length) % 1 : 1;
            arc.scale.setScalar(0.4 + s * 1.6);
            arc.material.opacity = blowing ? (1 - s) * 0.9 : 0;
          });
        },
      },
      7: {
        digit: buildDigit([sevenPath]), model: cane, restY: GROUND_Y - CANE_BOTTOM,
        carry: { fig: santa, reach: 0.15, elbow: 0.35, taps: true, grip: new THREE.Vector2(0.3, 1.4), upright: 0.27, scale: 0.43, swing: 0.12, intro: 'A walking stick... who needs it? 🦯', onPicked: () => sfx.hoho() },
        enter() { startCarry(this.carry); },
        update(dt) { updateCarry(dt, this.carry, 'Ho ho ho! Off for a stroll! 🎅'); },
      },
      8: {
        digit: buildDigit([eightPath]), model: snowman, restY: GROUND_Y - SNOWMAN_BOTTOM,
        reveal() { envTarget = ENV.snow; }, // winter arrives as he forms
        enter() {
          snowfall.visible = true;
          this.wind = loops.wind();
          this.wind.set(0.05, 2);
          this.nextJingle = 0.2;
          status(again('Hello there! ☃️'));
        },
        update(dt, t) {
          snowman.named.armR.rotation.z = 0.15 + Math.sin(t * 7) * 0.4; // waving hello
          stage.rotation.z = Math.sin(t * 1.2) * 0.015;
          updateSnow(dt, now);
          if (t > this.nextJingle) {
            this.nextJingle = t + 4.5;
            sfx.jingle();
          }
        },
      },
      9: {
        digit: buildDigit([ninePath]), model: lollipop, restY: GROUND_Y - LOLLI_BOTTOM,
        carry: { fig: santa, reach: 0.9, elbow: 0.9, grip: new THREE.Vector2(0.62, -0.9), upright: 0, scale: 0.4, swing: 0.05, intro: 'Ooh, a lollipop! 🍭', onPicked: () => { sfx.yum(); sfx.hoho(0.5); } },
        enter() { startCarry(this.carry); },
        update(dt) { updateCarry(dt, this.carry, 'Ho ho ho! Yummy! 🍭'); },
      },
    };
    for (const s of Object.values(SHAPES)) {
      // Sort by height so particles travel coherently (top of digit -> top of model)
      s.digit.points.sort((a, b) => b.p.y - a.p.y);
      s.model.points.sort((a, b) => b.p.y - a.p.y);
      stage.add(s.digit.group, s.model.group);
    }

    function clearStage() {
      stopLoops();
      for (const s of Object.values(SHAPES)) {
        s.digit.group.visible = false;
        s.model.group.visible = false;
        s.reset?.();
      }
      for (const o of [particles, kidGroup, soundGroup, santa, snowfall]) o.visible = false;
      stage.position.set(0, 0, 0);
      stage.rotation.set(0, 0, 0);
      stage.scale.setScalar(1);
      envTarget = ENV.day;
    }

    function start(digit) {
      clearStage();
      current = SHAPES[digit];
      loadMorph(current.digit.points, current.model.points);
      material.uniforms.uProgress.value = 0;
      current.digit.group.visible = true;
      current.digit.group.scale.setScalar(0.6);
      phase = 'hold';
      phaseTime = 0;
      sfx.chime();
      status(`Nice ${digit}! ✨`);
    }

    // ---------- connect-the-dots: dots are laid along each digit's strokes, projected to the screen ----------
    const DIGIT_STROKES = {
      1: [onePath], 2: [twoPath], 3: [threePath], 4: [fourPath, stemPath],
      5: [fivePath], 6: [sixPath], 7: [sevenPath], 8: [eightPath], 9: [ninePath],
    };
    const DOT_SPACING = 0.45; // model units between dots
    const HIT_RADIUS = 34;    // px: how close the pen must pass to collect a dot

    const drawCanvas = document.getElementById('draw');
    const ctx = drawCanvas.getContext('2d');
    function sizeDrawCanvas() {
      drawCanvas.width = window.innerWidth;
      drawCanvas.height = window.innerHeight;
      smokeMat.uniforms.uScale.value = window.innerHeight * renderer.getPixelRatio() * 1.207; // world units -> px at 45° fov
    }
    sizeDrawCanvas();

    let activeDigit = null;
    let dots = [];    // { x, y, hit }
    let strokes = [];
    let stroke = null;

    function toScreen(p) {
      const v = p.clone().project(camera);
      return { x: ((v.x + 1) / 2) * drawCanvas.width, y: ((1 - v.y) / 2) * drawCanvas.height };
    }

    function layoutDots() {
      camera.updateMatrixWorld();
      const all = DIGIT_STROKES[activeDigit].flatMap((curve) => {
        const count = Math.max(2, Math.round(curve.getLength() / DOT_SPACING));
        return curve.getSpacedPoints(count).map((p) => ({ ...toScreen(p), hit: false }));
      });
      // closed loops (8) end where they start: drop dots sitting on an earlier one
      dots = all.filter((d, i) => !all.slice(0, i).some((o) => Math.hypot(o.x - d.x, o.y - d.y) < 14));
    }

    function renderDrawing() {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      // the lines joining the dots touched so far (each stroke is a list of dots)
      ctx.save();
      ctx.strokeStyle = '#ff3d7f';
      ctx.lineWidth = 10;
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 6;
      for (const s of [...strokes, ...(stroke ? [stroke] : [])]) {
        ctx.beginPath();
        s.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
      }
      ctx.restore();
      // the dots, with the next one to reach highlighted
      const next = dots.find((d) => !d.hit);
      ctx.strokeStyle = '#0b0f1a';
      ctx.lineWidth = 2.5;
      for (const d of dots) {
        const isNext = d === next;
        ctx.beginPath();
        ctx.arc(d.x, d.y, isNext ? 11 : 8, 0, Math.PI * 2);
        ctx.fillStyle = d.hit ? '#35c46a' : isNext ? '#ffd23f' : '#ffffff';
        ctx.fill();
        ctx.stroke();
      }
    }

    // Ink only ever joins dots: the pen "touches" a dot when it comes within HIT_RADIUS of it, and
    // the line runs dot to dot. Touching the screen anywhere else draws nothing.
    const RETRACE_RADIUS = 16; // px: passing this close over an already-joined dot routes the line through it again
    const near = (d, p) => Math.hypot(d.x - p.x, d.y - p.y);
    function touchDots(p) {
      const touched = dots.filter((d) => !d.hit && near(d, p) < HIT_RADIUS);
      for (const d of touched) {
        d.hit = true;
        sfx.pop(dots.filter((o) => o.hit).length);
      }
      if (!touched.length) {
        const again = dots.find((d) => d.hit && near(d, p) < RETRACE_RADIUS);
        if (again) touched.push(again);
      }
      return touched.sort((d1, d2) => near(d1, p) - near(d2, p));
    }

    const busy = () => phase === 'hold' || phase === 'morph' || phase === 'settle';

    // ---------- spoken hint when a number is picked (browser text-to-speech) ----------
    const KID_NAME = 'Advik';
    const LOOKS_LIKE = {
      1: 'a rocket', 2: 'a duck', 3: 'a slide', 4: 'a flag', 5: 'a crane hook',
      6: 'a whistle', 7: 'a walking stick', 8: 'a snowman', 9: 'a lollipop',
    };
    let voice = null;
    function pickVoice() {
      const voices = window.speechSynthesis?.getVoices() ?? [];
      // Indian English first: the natural-sounding online voices, then the ones built into the device
      const indian = voices.filter((v) => /^en-IN$/i.test(v.lang.replace('_', '-')));
      voice = indian.find((v) => /neerja/i.test(v.name) && !/preview/i.test(v.name))
        ?? indian.find((v) => /natural|online/i.test(v.name))
        ?? indian.find((v) => /veena|isha|google/i.test(v.name))
        ?? indian[0]
        ?? voices.find((v) => /^en/i.test(v.lang)) ?? null;
    }
    if (window.speechSynthesis) {
      pickVoice();
      window.speechSynthesis.addEventListener?.('voiceschanged', pickVoice);
    }
    function say(text) {
      if (audio.muted || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel(); // a new pick interrupts the last sentence
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        if (voice) u.voice = voice;
        u.rate = 0.92;
        u.pitch = 1.05;
        window.speechSynthesis.speak(u);
      } catch (e) { console.warn('[speech]', e); }
    }

    function selectDigit(digit) {
      if (busy()) return;
      clearStage();
      current = null;
      phase = 'idle';
      homeCamera(); // dots are projected through the camera, so it must be back at its home view
      activeDigit = digit;
      strokes = [];
      stroke = null;
      layoutDots();
      renderDrawing();
      document.querySelectorAll('#picker button').forEach((b) => b.classList.toggle('active', +b.dataset.digit === digit));
      sfx.click();
      say(`${KID_NAME}, you are drawing ${digit}. It looks like ${LOOKS_LIKE[digit]}!`);
      status(`Join all the dots to make a ${digit}! ✏️`);
    }

    let pen = null; // last pointer position of the current stroke
    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!activeDigit || busy()) return;
      pen = { x: e.clientX, y: e.clientY };
      const touched = touchDots(pen);
      if (!touched.length) return; // not on a dot: nothing starts, nothing is drawn
      stroke = touched;
      renderDrawing();
      drawCanvas.setPointerCapture(e.pointerId);
      if (dots.every((d) => d.hit)) finishDots();
    });
    drawCanvas.addEventListener('pointermove', (e) => {
      if (!stroke) return;
      // sample along the movement so quick strokes still pass over dots
      const p = { x: e.clientX, y: e.clientY };
      const steps = Math.ceil(near(p, pen) / 10);
      for (let i = 1; i <= steps; i++) {
        const q = { x: pen.x + ((p.x - pen.x) * i) / steps, y: pen.y + ((p.y - pen.y) * i) / steps };
        for (const d of touchDots(q)) if (d !== stroke[stroke.length - 1]) stroke.push(d);
      }
      pen = p;
      renderDrawing();
      if (dots.every((d) => d.hit)) finishDots();
    });
    drawCanvas.addEventListener('pointerup', () => {
      if (!stroke) return;
      strokes.push(stroke);
      stroke = null;
      renderDrawing();
    });

    function finishDots() {
      const digit = activeDigit;
      activeDigit = null;
      stroke = null;
      document.querySelectorAll('#picker button').forEach((b) => b.classList.remove('active'));
      setTimeout(() => {
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        dots = [];
        strokes = [];
        start(digit);
      }, 350);
    }

    document.querySelectorAll('#picker button').forEach((b) => {
      b.addEventListener('click', () => selectDigit(+b.dataset.digit));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      sizeDrawCanvas();
      if (activeDigit) { layoutDots(); renderDrawing(); }
    });

    // ---------- loop ----------
    function updateCamera(dt) {
      // while an object is doing its thing the camera drifts gently around it; otherwise it stays home
      const done = phase === 'done';
      const sway = done ? Math.sin(phaseTime * 0.25) * 0.2 : 0;
      const targetY = done ? (current.lookY?.() ?? -0.4) : 0;
      camLookY = done ? camLookY + (targetY - camLookY) * Math.min(1, dt * 2) : 0;
      camera.position.set(Math.sin(CAM_A + sway) * CAM_R, CAM_Y, Math.cos(CAM_A + sway) * CAM_R);
      camera.lookAt(0, camLookY, 0);
    }

    function updateWorld(dt) {
      const k = 1 - Math.exp(-dt * 2.5);
      skyMat.uniforms.uTop.value.lerp(envTarget.top, k);
      skyMat.uniforms.uBottom.value.lerp(envTarget.bottom, k);
      groundMat.color.lerp(envTarget.ground, k);
      scene.fog.color.copy(skyMat.uniforms.uBottom.value);
      for (const cloud of clouds) {
        cloud.position.x += dt * 0.25;
        if (cloud.position.x > 55) cloud.position.x = -55;
      }
      updateSmoke(dt);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      now = material.uniforms.uTime.value += dt;
      phaseTime += dt;

      if (phase === 'hold') {
        // the finished number pops in as a solid, then breaks into particles
        current.digit.group.scale.setScalar(lerp(0.6, 1, easeOutBack(Math.min(1, phaseTime / 0.35))));
        if (phaseTime > HOLD) {
          current.digit.group.visible = false;
          particles.visible = true;
          phase = 'morph';
          phaseTime = 0;
          sfx.whoosh();
          status('Transforming...');
        }
      } else if (phase === 'morph') {
        const u = material.uniforms.uProgress;
        u.value = Math.min(1, u.value + dt / MORPH);
        if (u.value === 1) {
          // particles have arrived: swap them for the solid object and let it settle onto the ground
          particles.visible = false;
          current.model.group.visible = true;
          current.reveal?.();
          current.landed = false;
          phase = 'settle';
          phaseTime = 0;
        }
      } else if (phase === 'settle') {
        const k = Math.min(1, phaseTime / SETTLE);
        const bounce = current.bounce !== false;
        stage.position.y = current.restY * (bounce ? easeOutBounce(k) : easeInOut(k));
        if (bounce && !current.landed && k > 0.36) {
          current.landed = true;
          sfx.thud();
        }
        if (k === 1) {
          phase = 'done';
          phaseTime = 0;
          current.enter();
        }
      } else if (phase === 'done') {
        current.update(dt, phaseTime);
      }

      updateWorld(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
