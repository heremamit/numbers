        aDelay.setX(i, (1 - clamp((a.p.y + 1.6) / 3.2, 0, 1)) * 0.7 + rand() * 0.3);
      }
      for (const a of [aPos, aTarget, aColorA, aColorB, aDelay]) a.needsUpdate = true;
    }

    const material = new THREE.ShaderMaterial({
      uniforms: {
        uProgress: { value: 0 },
        uTime: { value: 0 },
        uSize: { value: 46 * renderer.getPixelRatio() },
      },
      vertexShader: /* glsl */ `
        uniform float uProgress;
        uniform float uTime;
        uniform float uSize;
        attribute vec3 aTarget;
        attribute vec3 aColorA;
        attribute vec3 aColorB;
        attribute vec3 aRandom;
        attribute float aDelay;
        varying vec3 vColor;

        const float PI = 3.14159265;

        float easeInOutCubic(float t) {
          return t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;
        }

        mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

        void main() {
          float t = clamp((uProgress - aDelay * 0.5) / 0.5, 0.0, 1.0);
          t = easeInOutCubic(t);
          float bump = sin(t * PI);

          vec3 pos = mix(position, aTarget, t);
          // burst outward and swirl around Y mid-flight
          pos += aRandom * bump * 1.6;
          pos.xz = rot(bump * (2.0 + aRandom.x)) * pos.xz;
          pos += 0.01 * bump * vec3(sin(uTime * 3.0 + aRandom.y * 20.0), cos(uTime * 2.0 + aRandom.z * 20.0), 0.0);

          vec4 mv = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = uSize * (0.75 + bump * 0.5) / -mv.z;

          vColor = mix(aColorA, aColorB, t) + bump * 0.12;
        }
      `,
      fragmentShader: /* glsl */ `
        varying vec3 vColor;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          gl_FragColor = vec4(vColor * (1.0 - d * 0.7), 1.0); // shaded like tiny beads
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `,
    });

    const particles = new THREE.Points(geometry, material);
    particles.visible = false;
    particles.frustumCulled = false;
    stage.add(particles);

    // ---------- game state ----------
    const HOLD = 1.4, MORPH = 3.0, SETTLE = 0.7;
    let current = null;   // active SHAPES entry
    let phase = 'idle';   // idle | ask | hold | morph | settle | done
    let phaseTime = 0;
    let now = 0;
    const statusEl = document.getElementById('status');
    const status = (text) => { statusEl.textContent = text; };
    const again = (msg) => `${msg} Pick another number!`;

    const easeOutBack = (k) => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
    const easeInOut = (k) => k * k * (3 - 2 * k);
    function easeOutBounce(k) {
      const n = 7.5625, d = 2.75;
      if (k < 1 / d) return n * k * k;
      if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
      if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375;
      return n * (k -= 2.625 / d) * k + 0.984375;
    }

    // someone walks in, picks the object up by its grip point, and walks off carrying it
    let carryStage = 'approach'; // approach | grab | walk
    let carryTime = 0;
    const handWorld = new THREE.Vector3();
    function startCarry(carry) {
      carry.fig.visible = true;
      carry.fig.userData.reachAngle = carry.reach;  // how high the carrying arm lifts
      carry.fig.userData.carryElbow = carry.elbow; // and how much its elbow bends
      carry.fig.position.set(-5.5, GROUND_Y, 0);
      carryStage = 'approach';
      carryTime = 0;
      status(carry.intro);
    }
    function updateCarry(dt, carry, msg) {
      const { fig, grip: gripPt, upright, scale: heldScale, swing } = carry;
      carryTime += dt;
      const grip = (s, angle) => new THREE.Vector3(gripPt.x, gripPt.y, 0)
        .applyAxisAngle(new THREE.Vector3(0, 0, 1), angle).multiplyScalar(s);
      if (carryStage === 'approach') {
        fig.position.x += WALK_SPEED * dt;
        poseWalk(fig, now, true, 0);
        fig.updateMatrixWorld(true);
        fig.userData.hand.getWorldPosition(handWorld);
        if (handWorld.x >= stage.position.x + gripPt.x - 0.05) {
          carryStage = 'grab';
          carryTime = 0;
          sfx.pick();
        }
        return;
      }
      const walking = carryStage === 'walk';
      if (walking) {
        fig.position.x += WALK_SPEED * dt;
        if (fig.position.x > 7) fig.position.x = -7;
      }
      poseWalk(fig, now, walking, 1);
      fig.updateMatrixWorld(true);
      fig.userData.hand.getWorldPosition(handWorld);
      // grab: blend the object from where it stood into the hand, upright and shrunk to carrying size
      const k = walking ? 1 : THREE.MathUtils.smootherstep(carryTime / 1.2, 0, 1);
      const s = lerp(1, heldScale, k);
      const angle = k * (upright + (walking ? Math.sin(now * (fig.userData.stride ?? 5)) * swing : 0)); // swings with each step
      stage.position.lerp(handWorld.clone().sub(grip(s, angle)), k);
      stage.rotation.set(0, 0, angle);
      stage.scale.setScalar(s);
      if (!walking && carryTime > 1.3) {
        carryStage = 'walk';
        status(again(msg));
        carry.onPicked?.();
      }
    }
    santa.userData.onStep = (sign) => {
      sfx.step(0.8); // heavy boots
      if (current?.carry?.taps && carryStage === 'walk' && sign > 0) sfx.tap(); // the cane taps every other step
    };

    // Each digit: its solid number, the object it becomes, where that object rests (stage height once
    // landed), and what the object does afterwards. enter() runs on landing, update() every frame after.
    const SHAPES = {
      1: {
        digit: buildDigit([onePath]), model: rocket, restY: GROUND_Y - ROCKET_BOTTOM,
        reset() { flame.visible = false; flameLight.intensity = 0; },
        enter() { this.step = 0; this.v = 0; this.gone = false; this.rumble = null; status('Ready for launch...'); },
        update(dt, t) {
          const beats = [0.3, 1.1, 1.9];
          while (this.step < 3 && t >= beats[this.step]) {
            sfx.beep();
            status(`${3 - this.step}...`);
            this.step++;
          }
          if (this.step === 3 && t >= 2.7) { // ignition
            this.step = 4;
            flame.visible = true;
            sfx.ignite();
            this.rumble = loops.rumble();
            this.rumble.set(0.7, 0.5);
            status('Ignition! 🔥');
          }
          if (this.step < 4 || this.gone) return;
          flame.scale.set(0.85 + rand() * 0.3, 0.8 + rand() * 0.5, 0.85 + rand() * 0.3);

          emitSmoke(stage.position.x, stage.position.y + ROCKET_BOTTOM - 0.3, 5);

            stage.position.y += this.v * dt;
            this.rumble.set(Math.max(0.12, 0.7 - stage.position.y * 0.035), 0.3);
          }
          if (stage.position.y > 18) {
            this.gone = true;
            rocket.group.visible = false;
            this.reset();
            this.rumble.stop(2.5);
            status(again('To the moon! 🌕'));
          }
        },
        lookY: () => clamp(stage.position.y * 0.5, -0.4, 6), // camera tilts up to follow
      },
      2: {
        digit: buildDigit([twoPath]), model: slide2.model, restY: slide2.restY,
        enter() { startRiders(); status(again('Down the pipe! 🛝')); },
        update(dt, t) { updateKids(t, slide2.curve); },
      },
      3: {
        digit: buildDigit([threePath]), model: slide3.model, restY: slide3.restY,
        enter() { startRiders(); status(again('Wheee! 🛝')); },
        update(dt, t) { updateKids(t, slide3.curve); },
      },
      4: {
        digit: buildDigit([fourPath, stemPath]), model: flag, restY: GROUND_Y + 1.6,
        reset() { waveCloth(0, 0); },
        enter() {
          this.wind = loops.wind();
          this.wind.set(0.09, 1.5);
          this.nextFlap = 0.4;
          // Santa strolls in from the left, turns side-on, and plays a shot at the flag
          resetFigure(santa);
          santa.visible = true;
          santa.position.set(-8, GROUND_Y, 0);
          this.golf = 'walk';
          this.turnT = 0;
          status('Fore! Santa is playing golf ⛳');
        },
        update(dt, t) {
          waveCloth(t, Math.min(1, t / 1.2)); // the breeze picks up
          if (t > this.nextFlap) {
            this.nextFlap = t + 0.22 + rand() * 0.4;
            sfx.flap();
          }
          this.updateGolf(dt, t);
        },
        updateGolf(dt, t) {
          const ADDRESS_X = -4.3;
          if (this.golf === 'walk') {
            santa.position.x = Math.min(ADDRESS_X, santa.position.x + 1.3 * dt);
            poseWalk(santa, now, true, 0);
            if (santa.position.x === ADDRESS_X) this.golf = 'turn';
            return;
          }
          if (this.golf === 'turn') { // face the camera, side-on to the flag
            poseWalk(santa, now, false, 0);
            this.turnT += dt;
            santa.rotation.y = -Math.PI / 2 * easeInOut(Math.min(1, this.turnT / 0.5));
            if (this.turnT >= 0.5) {
              golf.pivot.visible = true;
              this.tee = addressBall();
              this.golf = 'swing';
              this.swingStart = t;
              this.round = -1;
            }
            return;
          }
          // one shot every 6 s: waggle, backswing, pause, strike, follow-through, ball flies into the cup
          const PERIOD = 6, c = (t - this.swingStart) % PERIOD, round = Math.floor((t - this.swingStart) / PERIOD);
          const TOP = -2.0, FINISH = 2.3, IMPACT = 2.07;
          if (round !== this.round) { // new ball on the tee
            this.round = round;
            this.flight = null;
            this.struck = this.swished = false;
            golfBall.position.copy(this.tee);
            golfBall.visible = true;
          }
          let a;
          if (c < 0.8) a = Math.sin(c * 8) * 0.04;
          else if (c < 1.8) a = TOP * easeInOut((c - 0.8) / 1.0);
          else if (c < 1.95) a = TOP;
          else if (c < IMPACT) { const k = (c - 1.95) / (IMPACT - 1.95); a = TOP * (1 - k * k); }
          else if (c < 2.4) { const k = (c - IMPACT) / (2.4 - IMPACT); a = FINISH * (1 - (1 - k) ** 2); }
          else if (c < 5.2) a = FINISH;
          else a = FINISH * (1 - easeInOut((c - 5.2) / 0.8));
          poseGolf(a);
          if (!this.swished && c >= 1.95) { this.swished = true; sfx.swish(); }
          if (!this.struck && c >= IMPACT) {
            this.struck = true;
            sfx.tock();
            const hole = new THREE.Vector3(stage.position.x + 0.35, GROUND_Y + BALL_R, 0);
            this.flight = { start: c, from: this.tee.clone(), to: hole, landed: false };
          }
          if (this.flight) {
            const f = (c - this.flight.start) / 1.7;
            if (f < 1) {
              golfBall.position.lerpVectors(this.flight.from, this.flight.to, f);
              golfBall.position.y += 3.2 * 4 * f * (1 - f); // high arc onto the green
            } else {
              golfBall.position.copy(this.flight.to);
              golfBall.position.y -= Math.min(1, (f - 1) / 0.12) * BALL_R * 2.5; // drops into the cup
              if (!this.flight.landed) {
                this.flight.landed = true;
                sfx.cup();
                sfx.clap();
                sfx.hoho(0.6);
                status(again('Hole in one! ⛳'));
              }
              if (f > 1.15) golfBall.visible = false;
            }
          }
        },
      },
      5: {
        digit: buildDigit([fivePath]), model: crane, restY: CRANE_REST, bounce: false, lookY: () => 0.35,
        reset() {
          towerPivot.visible = false;
          this.setHook(0, 0);

          this.paintHookGift(0);

          cart.loaded.forEach((g) => { g.visible = false; });

        },
        setHook(dx, h) { // dx = trolley travel along the jib, h = hook height (negative = lowered)

        paintHookGift(i) {

        enter() {
          this.motor = loops.motor();
          towerPivot.visible = true;
          towerPivot.scale.y = 0.001;
          pile.forEach((g) => { g.visible = true; });
          cart.group.visible = true;
          cart.loaded.forEach((g) => { g.visible = false; });
          resetFigure(santa);
          santa.visible = true;
          santa.rotation.y = -Math.PI; // pushes the empty cart in from the right
          this.cartX = 6;
          this.santa = 'arrive';
          this.santaT = 0;
          // hook heights: carried gifts travel high enough to clear the cart's stack
          const TRAVEL = 0.45;
          const onto = (bottomY) => bottomY - GIFT_BOTTOM0;
          const bed = (layer) => onto(GROUND_Y + CART_BED + layer * GIFT.h);
          const ground = onto(GROUND_Y);
          const deliver = (slot) => [
            { h: TRAVEL, dur: 1.0, motor: 76 },
            { dx: CART_X + CART_SLOTS[slot][0], dur: 2.0, motor: 66 },
            { h: bed(CART_SLOTS[slot][1]), dur: 1.3, motor: 58 },
            { dur: 0.5, then: () => { // set it down on the cart and unhook
              crane.named.gift.visible = false;
              cart.loaded[slot].visible = true;
              sfx.thud();
              status(`Gift ${slot + 1} of 3 loaded! 🎁`);
            } },
            { h: TRAVEL, dur: 0.9, motor: 76 },
          ];
          const fetch = (i) => [
            { dx: PILE_X[i], dur: 2.3, motor: 66 },
            { h: ground, dur: 1.4, motor: 58 },
            { dur: 0.5, then: () => { // hook onto the next gift on the ground
              pile[i].visible = false;
              this.paintHookGift(i + 1);
              crane.named.gift.visible = true;
              sfx.clank();
            } },
          ];
          this.script = [
            { dur: 1.4 }, // the tower rises
            ...deliver(0), ...fetch(0), ...deliver(1), ...fetch(1), ...deliver(2),
            { dx: 0, dur: 2.3, motor: 66 },
            { h: 0, dur: 0.9, motor: 58, then: () => { this.santa = 'turn'; this.santaT = 0; } },
          ];
          this.step = 0;
          this.stepT = 0;
          this.at = { dx: 0, h: 0 };
          this.setHook(0, 0);
          this.paintHookGift(0);
          crane.named.gift.visible = true;
          status('Santa needs his gifts loaded! 🎅🎁');
        },
        update(dt, t) {
          towerPivot.scale.y = Math.max(0.001, 1 - Math.pow(1 - Math.min(1, t / 0.9), 3)); // tower rises
          this.runCrane(dt);
          this.runSanta(dt);
        },
        runCrane(dt) {
          const move = this.script[this.step];
          if (!move) return;
          if (this.stepT === 0) {
            this.motor.setPitch(move.motor ?? 58);
            this.motor.set(move.motor ? 0.1 : 0, 0.15);
          }
          this.stepT += dt;
          const k = easeInOut(Math.min(1, this.stepT / move.dur));
          const dx = lerp(this.at.dx, move.dx ?? this.at.dx, k), h = lerp(this.at.h, move.h ?? this.at.h, k);
          this.setHook(dx, h);
          if (this.stepT >= move.dur) {
            this.at = { dx, h };
            move.then?.();
            this.step++;
            this.stepT = 0;
            if (!this.script[this.step]) this.motor.set(0, 0.2);
          }
        },
        runSanta(dt) {
          this.santaT += dt;
          const arms = santa.userData.arms;
          if (this.santa === 'arrive' || this.santa === 'wait') { // facing left, hands on the handle
            if (this.santa === 'arrive') {
              this.cartX = Math.max(CART_X, this.cartX - 1.4 * dt);
              if (this.cartX === CART_X) this.santa = 'wait';

            poseWalk(santa, now, this.santa === 'arrive', 0);
            arms.forEach((a) => { a.shoulder.rotation.set(0, 0, 0.9); a.elbow.rotation.z = 0.2; });

        },
      },
      6: {
        digit: buildDigit([sixPath]), model: whistle, restY: GROUND_Y - WHISTLE_BOTTOM,

        update(dt, t) {

            poseWalk(santa, now, true, 0);

          const reach = new THREE.Vector3(0.45, -0.75 + lift * 1.1, 0.35 + lift * 0.3).normalize(); // world direction
          const handTarget = shoulder.clone().addScaledVector(reach, 0.85);
          const local = d.upper.worldToLocal(handTarget.clone());
          stickArm.shoulder.quaternion.setFromUnitVectors(DOWN, local.sub(stickArm.shoulder.position).normalize());
          stickArm.elbow.rotation.z = 0;
          waveArm.shoulder.rotation.set(-lift * (2.3 + Math.sin(now * 8) * 0.25), 0, 0.2);
          waveArm.elbow.rotation.z = lift * 0.5;
          d.head.rotation.set(0, 0, lift * 0.12); // chin up for the photo
          santa.updateMatrixWorld(true);
          const hand = stickArm.hand.getWorldPosition(new THREE.Vector3());
          const phonePos = hand.clone().addScaledVector(reach, 1.35 * lift);
          selfie.stick.position.copy(hand);
          selfie.stick.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), reach);
          selfie.stick.scale.y = Math.max(0.01, 1.35 * lift);
          // phone screen faces the two of them
          const santaHead = d.head.getWorldPosition(new THREE.Vector3());
          const snowHead = new THREE.Vector3(0, 0.68, 0).applyMatrix4(stage.matrixWorld);
          const subject = santaHead.clone().lerp(snowHead, 0.5);
          selfie.phone.position.copy(phonePos);
          selfie.phone.lookAt(subject);
          if (this.mode === 'raise') {
            if (this.modeT >= 0.9) this.next('countdown');
            return;
          }
          if (this.mode === 'countdown') {
            const n = Math.floor(this.modeT / 0.8);
            if (n !== this.count && n < 3) {
              this.count = n;
              sfx.beep();
              status(`Say cheese! ${3 - n}...`);
            }
            if (this.modeT >= 2.4) {
              this.snap(phonePos);
              this.next('pose');
            }
            return;
          }
          // after the photo: keep waving; take another picture every few seconds
          if (this.modeT > 6) {
            this.count = -1;
            this.next('countdown');
          }
        },
        snap(phonePos) {
          // render what the phone sees, straight into the photo
          const cam = selfie.cam, w = renderer.domElement.width, h = renderer.domElement.height;
          cam.aspect = w / h;
          cam.updateProjectionMatrix();
          // frame the shot so all of Santa and all of the snowman (hat to base, both arms) are in it:
          // look from the phone's side, backing off just far enough for both to fit the square photo
          selfie.kit.visible = false;
          const box = new THREE.Box3().setFromObject(santa).union(new THREE.Box3().setFromObject(snowman.group));
          const sphere = box.getBoundingSphere(new THREE.Sphere()), centre = sphere.center;
          const fit = sphere.radius / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)); // fits from any viewing angle
          const from = phonePos.clone().sub(centre).normalize();
          cam.position.copy(centre).addScaledVector(from, Math.max(fit, phonePos.distanceTo(centre)));
          cam.lookAt(centre);
          renderer.render(scene, cam);
          const side = Math.min(w, h);
          selfie.photoCtx.drawImage(renderer.domElement, (w - side) / 2, (h - side) / 2, side, side, 0, 0, 360, 360);
          selfie.kit.visible = true;
          selfie.photoEl.classList.add('show');
          selfie.flashEl.classList.add('on');
          requestAnimationFrame(() => selfie.flashEl.classList.remove('on'));
          sfx.shutter();
          sfx.hoho(0.4);
          status(again('Click! 📸 Best friends! ☃️🎅'));
        },
        next(mode) {
          this.mode = mode;
          this.modeT = 0;
        },
      },
      9: {
        digit: buildDigit([ninePath]), model: lollipop, restY: GROUND_Y - LOLLI_BOTTOM,
        carry: { fig: santa, reach: 0.9, elbow: 0.9, grip: new THREE.Vector2(0.62, -0.9), upright: 0, scale: 0.4, swing: 0.05, intro: 'Ooh, a lollipop! 🍭', onPicked: () => { sfx.yum(); sfx.hoho(0.5); } },
        enter() { startCarry(this.carry); },
        update(dt) { updateCarry(dt, this.carry, 'Ho ho ho! Yummy! 🍭'); },
      },
    };
    for (const s of Object.values(SHAPES)) {
      // Sort by height so particles travel coherently (top of digit -> top of model)
      s.digit.points.sort((a, b) => b.p.y - a.p.y);
      s.model.points.sort((a, b) => b.p.y - a.p.y);
      stage.add(s.digit.group, s.model.group);
    }

    function clearStage() {
      stopLoops();
      for (const s of Object.values(SHAPES)) {
        s.digit.group.visible = false;
        s.model.group.visible = false;
        s.reset?.();
      }
      for (const o of [particles, kidGroup, soundGroup, santa, snowfall, golfBall, golf.pivot]) o.visible = false;
      resetFigure(santa);
      stage.position.set(0, 0, 0);
      stage.rotation.set(0, 0, 0);
      stage.scale.setScalar(1);
      envTarget = ENV.day;
      hidePhoto();
    }

    function start(digit) {
      clearStage();
      current = SHAPES[digit];
      loadMorph(current.digit.points, current.model.points);
      material.uniforms.uProgress.value = 0;
      current.digit.group.visible = true;
      current.digit.group.scale.setScalar(0.6);
      phase = 'ask';
      phaseTime = 0;
      sfx.chime();
      quiz = { digit, misses: 0, asked: 0, talking: false };
      status('Which number is this? 🤔');
      ask(`${KID_NAME}, which number is this?`);
    }

    // ---------- connect-the-dots: dots are laid along each digit's strokes, projected to the screen ----------
    const DIGIT_STROKES = {
      1: [onePath], 2: [twoPath], 3: [threePath], 4: [fourPath, stemPath],
      5: [fivePath], 6: [sixPath], 7: [sevenPath], 8: [eightPath], 9: [ninePath],
    };
    const DOT_SPACING = 0.45; // model units between dots
    const HIT_RADIUS = 34;    // px: how close the pen must pass to collect a dot

    const drawCanvas = document.getElementById('draw');
    const ctx = drawCanvas.getContext('2d');
    function sizeDrawCanvas() {
      drawCanvas.width = window.innerWidth;
      drawCanvas.height = window.innerHeight;
      smokeMat.uniforms.uScale.value = window.innerHeight * renderer.getPixelRatio() * 1.207; // world units -> px at 45° fov
    }
    sizeDrawCanvas();

    let activeDigit = null;
    let dots = [];    // { x, y, hit }
    let strokes = [];
    let stroke = null;

    function toScreen(p) {
      const v = p.clone().project(camera);
      return { x: ((v.x + 1) / 2) * drawCanvas.width, y: ((1 - v.y) / 2) * drawCanvas.height };
    }

    function layoutDots() {
      camera.updateMatrixWorld();
      const all = DIGIT_STROKES[activeDigit].flatMap((curve) => {
        const count = Math.max(2, Math.round(curve.getLength() / DOT_SPACING));
        return curve.getSpacedPoints(count).map((p) => ({ ...toScreen(p), hit: false }));
      });
      // closed loops (8) end where they start: drop dots sitting on an earlier one
      dots = all.filter((d, i) => !all.slice(0, i).some((o) => Math.hypot(o.x - d.x, o.y - d.y) < 14));
    }

    function renderDrawing() {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      // the lines joining the dots touched so far (each stroke is a list of dots)
      ctx.save();
      ctx.strokeStyle = '#ff3d7f';
      ctx.lineWidth = 10;
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 6;
      for (const s of [...strokes, ...(stroke ? [stroke] : [])]) {
        ctx.beginPath();
        s.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
      }
      ctx.restore();
      // the dots, with the next one to reach highlighted
      const next = dots.find((d) => !d.hit);
      ctx.strokeStyle = '#0b0f1a';
      ctx.lineWidth = 2.5;
      for (const d of dots) {
        const isNext = d === next;
        ctx.beginPath();
        ctx.arc(d.x, d.y, isNext ? 11 : 8, 0, Math.PI * 2);
        ctx.fillStyle = d.hit ? '#35c46a' : isNext ? '#ffd23f' : '#ffffff';
        ctx.fill();
        ctx.stroke();
      }
    }

    // Ink only ever joins dots: the pen "touches" a dot when it comes within HIT_RADIUS of it, and
    // the line runs dot to dot. Touching the screen anywhere else draws nothing.
    const RETRACE_RADIUS = 16; // px: passing this close over an already-joined dot routes the line through it again
    const near = (d, p) => Math.hypot(d.x - p.x, d.y - p.y);
    function touchDots(p) {
      const touched = dots.filter((d) => !d.hit && near(d, p) < HIT_RADIUS);
      for (const d of touched) {
        d.hit = true;
        sfx.pop(dots.filter((o) => o.hit).length);
      }
      if (!touched.length) {
        const again = dots.find((d) => d.hit && near(d, p) < RETRACE_RADIUS);
        if (again) touched.push(again);
      }
      return touched.sort((d1, d2) => near(d1, p) - near(d2, p));
    }

    const busy = () => phase === 'ask' || phase === 'hold' || phase === 'morph' || phase === 'settle';

    // ---------- spoken hint when a number is picked (browser text-to-speech) ----------
    const KID_NAME = 'Advik';
    const LOOKS_LIKE = {
      1: 'a rocket', 2: 'a slide with a long pipe', 3: 'a twisty slide', 4: 'a golf flag', 5: 'a big crane',
      6: 'a whistle', 7: 'a walking stick', 8: 'a snowman', 9: 'a lollipop',
    };
    let voice = null;
    function pickVoice() {
      const voices = window.speechSynthesis?.getVoices() ?? [];
      // Indian English first: the natural-sounding online voices, then the ones built into the device
      const indian = voices.filter((v) => /^en-IN$/i.test(v.lang.replace('_', '-')));
      voice = indian.find((v) => /neerja/i.test(v.name) && !/preview/i.test(v.name))
        ?? indian.find((v) => /natural|online/i.test(v.name))
        ?? indian.find((v) => /veena|isha|google/i.test(v.name))
        ?? indian[0]
        ?? voices.find((v) => /^en/i.test(v.lang)) ?? null;
    }
    if (window.speechSynthesis) {
      pickVoice();
      window.speechSynthesis.addEventListener?.('voiceschanged', pickVoice);
    }
    let sayId = 0;
    let utterance = null; // kept referenced, or Chrome may drop it before its end event fires
    // `then` runs once the sentence has been spoken (straight away when muted); a newer say() cancels it
    function say(text, then) {
      const id = ++sayId;
      let fired = false;
      const done = () => {
        if (fired || id !== sayId) return;
        fired = true;
        then?.();
      };
      if (audio.muted || !window.speechSynthesis) return done();
      try {
        window.speechSynthesis.cancel(); // a new sentence interrupts the last one
        const u = utterance = new SpeechSynthesisUtterance(text);
        u.lang = 'en-IN';
        if (voice) u.voice = voice;
        u.rate = 0.92;
        u.pitch = 1.05;
        u.onend = u.onerror = done;
        window.speechSynthesis.speak(u);
        if (then) setTimeout(done, 2000 + text.length * 120); // in case the browser never reports the end
      } catch (e) {
        console.warn('[speech]', e);
        done();
      }
    }

    // ---------- "which number is this?": the drawn number only transforms once it has been named ----------
    // The answer can be spoken (speech recognition, where the browser has it) or tapped on the number bar.
    const SPOKEN = { // first entry is the real word, the rest are what recognisers tend to hear instead
      1: ['one', 'won', 'wan'], 2: ['two', 'to', 'too', 'tu'], 3: ['three', 'tree', 'free', 'thri'],
      4: ['four', 'for', 'fore', 'foor'], 5: ['five', 'fife', 'hive'], 6: ['six', 'sex', 'sics', 'sick'],
      7: ['seven', 'sevan', 'saven'], 8: ['eight', 'ate', 'ait', 'eat'], 9: ['nine', 'nain', 'nein', 'line'],
    };
    const wordsIn = (text) => text.toLowerCase().match(/[a-z]+|\d/g) ?? [];
    const saysTarget = (text) => wordsIn(text).some((w) => w === String(quiz.digit) || SPOKEN[quiz.digit].includes(w));
    // a clearly spoken different number (sound-alikes such as "to" / "for" don't count as a wrong answer)
    const otherNumber = (text) => {
      const words = wordsIn(text);
      for (let n = 1; n <= 9; n++) {
        if (n !== quiz.digit && (words.includes(String(n)) || words.includes(SPOKEN[n][0]))) return n;
      }
      return 0;
    };

    let quiz = { digit: 0, misses: 0, asked: 0, talking: false };
    const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition;
    let rec = null;
    let micOk = !!Recognition;

    function listen() {
      if (!micOk || rec || quiz.talking || phase !== 'ask') return;
      try {
        const r = rec = new Recognition();
        r.lang = 'en-IN';
        r.interimResults = true;
        r.maxAlternatives = 5;
        r.onstart = () => { if (rec === r) statusEl.classList.add('mic'); };
        r.onresult = (e) => {
          if (rec !== r || phase !== 'ask') return;
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const result = e.results[i];
            const heard = Array.from(result, (alt) => alt.transcript);
            if (heard.some(saysTarget)) return answer(quiz.digit);
            const wrong = result.isFinal && otherNumber(heard[0]);
            if (wrong) return answer(wrong);
          }
        };
        r.onerror = (e) => {
          // silence is fine; anything else (mic blocked, no network...) leaves tapping as the way to answer
          if (e.error !== 'no-speech' && e.error !== 'aborted') micOk = false;
        };
        r.onend = () => {
          if (rec !== r) return;
          rec = null;
          statusEl.classList.remove('mic');
          setTimeout(listen, 250); // keep listening until the number is named
        };
        r.start();
      } catch (e) {
        console.warn('[mic]', e);
        rec = null;
        micOk = false;
      }
    }
    function stopListening() {
      const r = rec;
      rec = null;
      statusEl.classList.remove('mic');
      try { r?.abort(); } catch (e) { /* already stopped */ }
    }

    // speak a prompt with the mic off (so it can't hear itself), then listen for the answer
    function ask(text) {
      stopListening();
      quiz.asked = phaseTime;
      quiz.talking = true;
      say(text, () => {
        quiz.talking = false;
        listen();
      });
    }

    const pickerButtons = [...document.querySelectorAll('#picker button')];
    function answer(n) {
      if (phase !== 'ask') return;
      const { digit } = quiz;
      if (n === digit) {
        stopListening();
        pickerButtons.forEach((b) => b.classList.remove('hint'));
        phase = 'hold';
        phaseTime = 0;
        sfx.chime();
        sfx.clap();
        status(`Yes! It's ${digit}! 🎉`);
        say(`Yes! This is ${digit}! Well done, ${KID_NAME}!`);
        return;
      }
      sfx.oops();
      if (++quiz.misses >= 2) {
        // two misses: show and tell the answer, but it still has to be said or tapped
        pickerButtons.forEach((b) => b.classList.toggle('hint', +b.dataset.digit === digit));
        status(`This is ${digit}! Say ${digit}! 👇`);
        ask(`This is ${digit}. Can you say ${digit}?`);
      } else {
        status(`Not ${n}. Try again! 🤔`);
        ask(`Not ${n}. Try again! Which number is this?`);
      }
    }

    function selectDigit(digit) {
      if (busy()) return;
      clearStage();
      current = null;
      phase = 'idle';
      homeCamera(); // dots are projected through the camera, so it must be back at its home view
      activeDigit = digit;
      strokes = [];
      stroke = null;
      layoutDots();
      renderDrawing();
      document.querySelectorAll('#picker button').forEach((b) => b.classList.toggle('active', +b.dataset.digit === digit));
      sfx.click();
      say(`${KID_NAME}, you are drawing ${digit}. It looks like ${LOOKS_LIKE[digit]}!`);
      status(`Join all the dots to make a ${digit}! ✏️`);
    }

    let pen = null; // last pointer position of the current stroke
    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!activeDigit || busy()) return;
      pen = { x: e.clientX, y: e.clientY };
      const touched = touchDots(pen);
      if (!touched.length) return; // not on a dot: nothing starts, nothing is drawn
      stroke = touched;
      renderDrawing();
      drawCanvas.setPointerCapture(e.pointerId);
      if (dots.every((d) => d.hit)) finishDots();
    });
    drawCanvas.addEventListener('pointermove', (e) => {
      if (!stroke) return;
      // sample along the movement so quick strokes still pass over dots
      const p = { x: e.clientX, y: e.clientY };
      const steps = Math.ceil(near(p, pen) / 10);
      for (let i = 1; i <= steps; i++) {
        const q = { x: pen.x + ((p.x - pen.x) * i) / steps, y: pen.y + ((p.y - pen.y) * i) / steps };
        for (const d of touchDots(q)) if (d !== stroke[stroke.length - 1]) stroke.push(d);
      }
      pen = p;
      renderDrawing();
      if (dots.every((d) => d.hit)) finishDots();
    });
    drawCanvas.addEventListener('pointerup', () => {
      if (!stroke) return;
      strokes.push(stroke);
      stroke = null;
      renderDrawing();
    });

    function finishDots() {
      const digit = activeDigit;
      activeDigit = null;
      stroke = null;
      document.querySelectorAll('#picker button').forEach((b) => b.classList.remove('active'));
      setTimeout(() => {
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        dots = [];
        strokes = [];
        start(digit);
      }, 350);
    }

    document.querySelectorAll('#picker button').forEach((b) => {
      b.addEventListener('click', () => {
        const digit = +b.dataset.digit;
        if (phase === 'ask') answer(digit);
        else selectDigit(digit);
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      sizeDrawCanvas();
      if (activeDigit) { layoutDots(); renderDrawing(); }
    });

    // ---------- loop ----------
    function updateCamera(dt) {
      // while an object is doing its thing the camera drifts gently around it; otherwise it stays home
      const done = phase === 'done';
      const sway = done ? Math.sin(phaseTime * 0.25) * 0.2 : 0;
      const targetY = done ? (current.lookY?.() ?? -0.4) : 0;
      camLookY = done ? camLookY + (targetY - camLookY) * Math.min(1, dt * 2) : 0;
      camera.position.set(Math.sin(CAM_A + sway) * CAM_R, CAM_Y, Math.cos(CAM_A + sway) * CAM_R);
      camera.lookAt(0, camLookY, 0);
    }

    function updateWorld(dt) {
      const k = 1 - Math.exp(-dt * 2.5);
      skyMat.uniforms.uTop.value.lerp(envTarget.top, k);
      skyMat.uniforms.uBottom.value.lerp(envTarget.bottom, k);
      groundMat.color.lerp(envTarget.ground, k);
      scene.fog.color.copy(skyMat.uniforms.uBottom.value);
      for (const cloud of clouds) {
        cloud.position.x += dt * 0.25;
        if (cloud.position.x > 55) cloud.position.x = -55;
      }
      updateSmoke(dt);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      now = material.uniforms.uTime.value += dt;
      phaseTime += dt;

      if (phase === 'ask') {
        // the finished number pops in as a solid and waits, breathing gently, until it is named
        const pop = lerp(0.6, 1, easeOutBack(Math.min(1, phaseTime / 0.35)));
        current.digit.group.scale.setScalar(pop * (1 + Math.sin(phaseTime * 3) * 0.03));
        if (!quiz.talking && phaseTime - quiz.asked > 15) ask(`${KID_NAME}, which number is this?`);
      } else if (phase === 'hold') {
        // named correctly: a happy hop, then it breaks into particles
        current.digit.group.scale.setScalar(1 + Math.sin(Math.PI * Math.min(1, phaseTime / 0.4)) * 0.12);
        if (phaseTime > HOLD) {
          current.digit.group.visible = false;
          particles.visible = true;
          phase = 'morph';
          phaseTime = 0;
          sfx.whoosh();
          status('Transforming...');
        }
      } else if (phase === 'morph') {
        const u = material.uniforms.uProgress;
        u.value = Math.min(1, u.value + dt / MORPH);
        if (u.value === 1) {
          // particles have arrived: swap them for the solid object and let it settle onto the ground
          particles.visible = false;
          current.model.group.visible = true;
          current.reveal?.();
          current.landed = false;
          phase = 'settle';
          phaseTime = 0;
        }
      } else if (phase === 'settle') {
        const k = Math.min(1, phaseTime / SETTLE);
        const bounce = current.bounce !== false;
        stage.position.y = current.restY * (bounce ? easeOutBounce(k) : easeInOut(k));
        if (bounce && !current.landed && k > 0.36) {
          current.landed = true;
          sfx.thud();
        }
        if (k === 1) {
          phase = 'done';
          phaseTime = 0;
          current.enter();
        }
      } else if (phase === 'done') {
        current.update(dt, phaseTime);
      }

      updateWorld(dt);
      updateCamera(dt);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
